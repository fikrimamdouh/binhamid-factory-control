name: Fix diesel menu and latest data fallback

on:
  push:
    branches: [agent/diesel-menu-latest-fallback]
    paths:
      - .github/workflows/fix-diesel-menu-latest-data.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diesel-menu-latest-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python3 scripts/apply-diesel-latest-fallback.py
      - name: Validate changed files
        run: |
          node --check api/_lib/fuel-analytics.js
          node --check api/_lib/bot-fuel-reports.js
          node --check api/_lib/telegram-webhook-handler.js
          node --test tests/fuel-latest-data-fallback.test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/fuel-analytics.js api/_lib/bot-fuel-reports.js api/_lib/telegram-webhook-handler.js tests/fuel-latest-data-fallback.test.mjs
          git commit -m "Open diesel menu and show latest available fuel data"
          git push origin agent/diesel-menu-latest-fallback
