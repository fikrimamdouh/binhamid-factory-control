name: Apply fuel ledger integration patch

on:
  push:
    branches:
      - agent/fuel-ledger-integration
    paths:
      - .github/workflows/apply-fuel-ledger-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: apply-fuel-ledger-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fuel-ledger-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fuel-ledger-bootstrap/patch.part* > /tmp/fuelledger.patch.gz.b64
          base64 -d /tmp/fuelledger.patch.gz.b64 | gzip -d > /tmp/fuelledger.patch
          echo "30b8e69671c3ec40f7cf473efb76f368871ee4610fcc828a2541fc9d3bff0961  /tmp/fuelledger.patch" | sha256sum -c -
          git apply --check /tmp/fuelledger.patch

      - name: Apply integration patch
        run: git apply /tmp/fuelledger.patch

      - name: Remove bootstrap files
        run: |
          rm -rf .github/fuel-ledger-bootstrap
          rm -f .github/workflows/apply-fuel-ledger-bootstrap.yml

      - name: Install dependencies
        run: npm ci

      - name: Run focused fuel tests
        run: |
          node --test tests/fuel-reports-section.test.mjs
          node --test tests/noor-khoy-fuel-sync.test.mjs

      - name: Run migration audit
        run: node scripts/audit-migrations.mjs

      - name: Run full test suite
        run: npm test

      - name: Commit applied integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Integrate queryable fuel ledger with Noor Khoy sync"
          git push origin HEAD:agent/fuel-ledger-integration
