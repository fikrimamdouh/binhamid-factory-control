name: Apply fuel report v2 parser and Telegram reports

on:
  push:
    branches: [agent/fuel-report-v2]
    paths:
      - .github/workflows/apply-fuel-report-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fuel-report-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply report and parser changes
        run: python3 scripts/expand-fuel-reports-and-kunya.py
      - name: Validate syntax and focused behavior
        run: |
          node --check api/_lib/fuel-summary-parser.js
          node --check api/_lib/fuel-analytics.js
          node --check api/_lib/bot-fuel-reports.js
          node --check api/_lib/bot-profile.js
          node --test tests/fuel-parser-multi-section.test.mjs tests/fuel-extra-reports-and-kunya.test.mjs tests/noor-khoy-fuel-sync.test.mjs
      - name: Run project tests
        run: npm test
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/fuel-summary-parser.js api/_lib/fuel-analytics.js api/_lib/bot-fuel-reports.js api/_lib/bot-profile.js tests/fuel-parser-multi-section.test.mjs tests/fuel-extra-reports-and-kunya.test.mjs
          git commit -m "Read multi-section fuel exports and expand Telegram reports"
          git push origin agent/fuel-report-v2
