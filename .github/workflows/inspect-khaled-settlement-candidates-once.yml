name: Inspect Khaled Customer Settlement Candidates Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-khaled-settlement-candidates-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: inspect-khaled-customer-settlements-once
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: khaled-settlement-connection.json
        run: node scripts/resolve-supabase-connection.mjs

      - name: Inspect exact counterpart evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/khaled-settlement-inspection.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          set statement_timeout='90s';
          with target(amount, movement_day, source_doc) as (
            values
              (538.75::numeric,'2026-07-22'::date,'84'::text),
              (595.00::numeric,'2026-07-25'::date,'87'::text),
              (1450.00::numeric,'2026-07-23'::date,'85'::text),
              (270.00::numeric,'2026-07-19'::date,'83'::text),
              (450.00::numeric,'2026-07-25'::date,'86'::text),
              (1440.00::numeric,'2026-07-25'::date,'88'::text)
          ),
          employee_rows as (
            select t.amount,t.movement_day,t.source_doc,m.id,m.batch_id,m.source_row_no,m.treasury_code,m.debit,m.credit,m.account_code,m.account_name,m.account_type,m.movement_type,m.voucher_no,m.movement_date_text,m.description,m.is_customer_collection
            from target t
            left join public.daily_report_cash_movements m
              on m.account_code='1100048'
             and greatest(coalesce(m.debit,0),coalesce(m.credit,0))=t.amount
             and (coalesce(m.movement_date_text,'')=t.movement_day::text or coalesce(m.voucher_no,'') in (t.source_doc, case t.source_doc when '83' then '486' when '85' then '493' when '86' then '495' when '87' then '496' when '88' then '498' else '' end))
          ),
          same_document_rows as (
            select e.amount,e.movement_day,e.source_doc,m.id,m.batch_id,m.source_row_no,m.account_code,m.account_name,m.account_type,m.debit,m.credit,m.movement_type,m.voucher_no,m.movement_date_text,m.description,m.is_customer_collection
            from employee_rows e
            join public.daily_report_cash_movements m on m.batch_id=e.batch_id
            where m.id is distinct from e.id
              and (
                (coalesce(m.voucher_no,'')<>'' and coalesce(m.voucher_no,'') in (e.source_doc, case e.source_doc when '83' then '486' when '85' then '493' when '86' then '495' when '87' then '496' when '88' then '498' else '' end))
                or (greatest(coalesce(m.debit,0),coalesce(m.credit,0))=e.amount and coalesce(m.account_type,'') ilike '%عميل%')
              )
          ),
          matching_collections as (
            select t.amount,t.movement_day,t.source_doc,c.id,c.reference_no,c.customer_external_id,c.customer_name,c.amount as collection_amount,c.allocated_amount,c.unallocated_amount,c.payment_method,c.occurred_at,c.note
            from target t
            join public.collection_events c on c.amount=t.amount
             and c.occurred_at::date between t.movement_day-interval '7 days' and t.movement_day+interval '7 days'
          ),
          sales_candidates as (
            select t.amount,t.movement_day,t.source_doc,s.customer_external_id,s.customer_name,
                   count(*) filter(where abs(coalesce(s.total_amount,0)-coalesce(s.paid_amount,0)-t.amount)<0.01) as exact_order_count,
                   jsonb_agg(jsonb_build_object('reference',s.reference_no,'date',coalesce(s.delivery_date,s.created_at::date),'salesType',s.sales_type,'item',s.item,'total',s.total_amount,'paid',s.paid_amount,'outstanding',greatest(0,coalesce(s.total_amount,0)-coalesce(s.paid_amount,0))) order by coalesce(s.delivery_date,s.created_at::date) desc) filter(where abs(coalesce(s.total_amount,0)-coalesce(s.paid_amount,0)-t.amount)<0.01) as exact_orders
            from target t
            join public.sales_orders s on s.status not in ('cancelled','rejected')
             and s.sales_type='block'
             and coalesce(s.delivery_date,s.created_at::date)<=t.movement_day
             and abs(coalesce(s.total_amount,0)-coalesce(s.paid_amount,0)-t.amount)<0.01
            group by t.amount,t.movement_day,t.source_doc,s.customer_external_id,s.customer_name
          ),
          portfolio_exact as (
            select t.amount,t.movement_day,t.source_doc,c.external_id,c.customer_name,
                   coalesce(ob.balance,0)+coalesce(so.outstanding,0)-coalesce(ce.unallocated,0) as calculated_debt,
                   so.block_orders,ce.collection_rows
            from target t
            cross join public.customers c
            left join lateral (
              select coalesce(sum(balance),0) balance
              from public.customer_opening_balances o
              where coalesce(o.customer_code,o.client_id)=coalesce(c.external_id,c.customer_code)
                and coalesce(o.balance_date,'1900-01-01'::date)<t.movement_day
            ) ob on true
            left join lateral (
              select coalesce(sum(greatest(0,coalesce(s.total_amount,0)-coalesce(s.paid_amount,0))),0) outstanding,
                     jsonb_agg(jsonb_build_object('reference',s.reference_no,'date',coalesce(s.delivery_date,s.created_at::date),'item',s.item,'outstanding',greatest(0,coalesce(s.total_amount,0)-coalesce(s.paid_amount,0))) order by coalesce(s.delivery_date,s.created_at::date) desc) filter(where greatest(0,coalesce(s.total_amount,0)-coalesce(s.paid_amount,0))>0) block_orders
              from public.sales_orders s
              where s.customer_external_id=coalesce(c.external_id,c.customer_code)
                and s.sales_type='block' and s.status not in ('cancelled','rejected')
                and coalesce(s.delivery_date,s.created_at::date)<t.movement_day
            ) so on true
            left join lateral (
              select coalesce(sum(coalesce(e.unallocated_amount,0)),0) unallocated,
                     jsonb_agg(jsonb_build_object('reference',e.reference_no,'date',e.occurred_at::date,'amount',e.amount,'unallocated',e.unallocated_amount)) filter(where coalesce(e.unallocated_amount,0)>0) collection_rows
              from public.collection_events e
              where e.customer_external_id=coalesce(c.external_id,c.customer_code)
                and e.status not in ('cancelled','rejected') and e.occurred_at::date<t.movement_day
            ) ce on true
            where c.active=true
              and abs((coalesce(ob.balance,0)+coalesce(so.outstanding,0)-coalesce(ce.unallocated,0))-t.amount)<0.01
          )
          select jsonb_pretty(jsonb_build_object(
            'employeeRows',(select coalesce(jsonb_agg(to_jsonb(x) order by x.movement_day,x.amount),'[]'::jsonb) from employee_rows x),
            'sameDocumentRows',(select coalesce(jsonb_agg(to_jsonb(x) order by x.movement_day,x.amount),'[]'::jsonb) from same_document_rows x),
            'matchingCollections',(select coalesce(jsonb_agg(to_jsonb(x) order by x.movement_day,x.amount),'[]'::jsonb) from matching_collections x),
            'exactOutstandingSales',(select coalesce(jsonb_agg(to_jsonb(x) order by x.movement_day,x.amount),'[]'::jsonb) from sales_candidates x),
            'exactPortfolioDebt',(select coalesce(jsonb_agg(to_jsonb(x) order by x.movement_day,x.amount),'[]'::jsonb) from portfolio_exact x)
          ));
          SQL
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --file /tmp/khaled-settlement-inspection.sql | tee khaled-settlement-candidates.json
          test -s khaled-settlement-candidates.json

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaled-settlement-candidates-${{ github.run_id }}
          path: |
            khaled-settlement-candidates.json
            khaled-settlement-connection.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish inspection status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:'inspect-khaled-customer-settlements',target_url:process.env.RUN_URL,description:success?'Exact settlement candidates inspected.':'Settlement inspection failed.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE
