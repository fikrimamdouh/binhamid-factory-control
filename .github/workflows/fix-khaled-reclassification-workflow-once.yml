name: Fix Khaled Reclassification Workflow Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-khaled-reclassification-workflow-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Correct the one-time production workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/reclassify-khaled-customer-settlements-once.yml')
          text=path.read_text(encoding='utf-8')
          bad="                if e.customer_external_id is null then null; end if;\n"
          if text.count(bad)!=1:
              raise SystemExit(f'Unexpected undefined-alias marker count: {text.count(bad)}')
          text=text.replace(bad,'')
          old=r"'^\\d{4}-\\d{2}-\\d{2}$'"
          count=text.count(old)
          if count!=2:
              raise SystemExit(f'Unexpected date-regex marker count: {count}')
          text=text.replace(old,"'^[0-9]{4}-[0-9]{2}-[0-9]{2}$'")
          path.write_text(text,encoding='utf-8')
          PY
          git config user.name 'binhamid-system'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/reclassify-khaled-customer-settlements-once.yml
          git commit -m 'تصحيح تنفيذ إعادة تصنيف تسويات خالد'
          git push origin HEAD:main
