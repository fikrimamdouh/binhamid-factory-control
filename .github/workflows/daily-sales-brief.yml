name: Daily sales brief

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/daily-sales-brief.yml
      - scripts/send-daily-sales-brief.mjs
      - api/_lib/routes/daily-sales-brief.js
      - api/router.js
  workflow_dispatch:
    inputs:
      slot:
        description: morning or evening; leave empty to infer Riyadh time
        required: false
        default: ''
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 15 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-sales-brief-${{ github.event.schedule || github.event.inputs.slot || github.run_id }}
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIEF_SLOT: ${{ github.event.inputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send scheduled sales report to Telegram
        run: node scripts/send-daily-sales-brief.mjs
