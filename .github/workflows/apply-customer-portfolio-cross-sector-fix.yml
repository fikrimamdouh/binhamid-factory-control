name: Apply customer portfolio cross-sector fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-customer-portfolio-cross-sector-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply exact patch
        run: python scripts/apply-customer-portfolio-cross-sector-fix.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Validate patch
        run: git diff --check

      - name: Commit fixed production code and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-customer-portfolio-cross-sector-fix.yml scripts/apply-customer-portfolio-cross-sector-fix.py
          git add -A
          git commit -m "Fix cross-sector customer portfolio sales and ownership counts"
          git push origin HEAD:main
