name: Extract Portfolio Template
on:
  pull_request:
    paths:
      - '.github/workflows/extract-portfolio-template.yml'
      - 'tests/_extract-portfolio-template.test.mjs'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Extract exact renderer and document CSS
        run: |
          mkdir -p extracted
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('legacy.html','utf8');
          function scan(start,mode){
            let quote='',escaped=false,templateDepth=0,curly=0,round=0,square=0,seenBrace=false;
            for(let i=start;i<source.length;i++){
              const ch=source[i],next=source[i+1];
              if(quote){
                if(escaped){escaped=false;continue;}
                if(ch==='\\'){escaped=true;continue;}
                if(quote==='`'&&ch==='$'&&next==='{'){templateDepth++;curly++;i++;continue;}
                if(quote==='`'&&templateDepth&&ch==='}'){templateDepth--;curly--;continue;}
                if(ch===quote&&!templateDepth)quote='';
                continue;
              }
              if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
              if(ch==='/'&&next==='/'){const nl=source.indexOf('\n',i);if(nl<0)return source.length;i=nl;continue;}
              if(ch==='/'&&next==='*'){const end=source.indexOf('*/',i+2);if(end<0)return source.length;i=end+1;continue;}
              if(ch==='{'){curly++;seenBrace=true;}else if(ch==='}')curly--;
              else if(ch==='(')round++;else if(ch===')')round--;
              else if(ch==='[')square++;else if(ch===']')square--;
              if(mode==='function'&&seenBrace&&curly===0)return i+1;
              if(mode==='const'&&ch===';'&&curly===0&&round===0&&square===0)return i+1;
            }
            return source.length;
          }
          function extractDeclaration(name){
            const f=`function ${name}`,fStart=source.indexOf(f);
            if(fStart>=0)return source.slice(fStart,scan(source.indexOf('{',fStart),'function'));
            const patterns=[`const ${name}=`,`const ${name} =`,`let ${name}=`,`let ${name} =`];
            for(const marker of patterns){const start=source.indexOf(marker);if(start>=0)return source.slice(start,scan(start,'const'));}
            throw new Error(`declaration ${name} not found`);
          }
          const names=['docCli','prCli','mast','tbar','sec','fv','fvRaw','cov','clause','att','exe','page','ref','money','esc','fmtG','today','clientPortfolioForEmployee'];
          for(const name of names)fs.writeFileSync(`extracted/${name}.js`,extractDeclaration(name));
          const cssStart=source.indexOf('/* ═══════════════════════════════════════════════════════════\n   DOCUMENT SYSTEM');
          const cssEnd=source.indexOf('</style>',cssStart);
          if(cssStart<0||cssEnd<0)throw new Error('document CSS not found');
          fs.writeFileSync('extracted/document.css',source.slice(cssStart,cssEnd));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: exact-portfolio-template
          path: extracted/
          retention-days: 1
