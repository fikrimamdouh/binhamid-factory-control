name: Inspect Concrete Payment Exceptions Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-concrete-payment-exceptions-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: concrete-exceptions-connection.json
        run: node scripts/resolve-supabase-connection.mjs
      - name: Inspect exception rows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/inspect-concrete-exceptions.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          set client_min_messages=warning;
          with codes(code) as (values('13147'),('13162'),('11533'),('11508'),('11720')),
          source as (
            select b.report_date,m.source_row_no,m.account_code,m.account_name,
                   round(greatest(coalesce(m.debit,0),coalesce(m.credit,0))::numeric,2) amount,
                   m.voucher_no,m.payment_method,m.movement_type,m.description
            from public.daily_report_cash_movements m join public.daily_report_batches b on b.id=m.batch_id
            where b.status='approved' and m.is_customer_collection=true and m.account_code in(select code from codes)
          ), events as (
            select e.id,e.reference_no,e.customer_external_id,e.customer_name,e.amount,e.allocated_amount,e.unallocated_amount,
                   e.payment_method,e.status,e.note,e.occurred_at,e.created_at
            from public.collection_events e where e.customer_external_id in(select code from codes)
          ), sales as (
            select s.id,s.reference_no,s.sales_type,s.customer_external_id,s.customer_name,s.total_amount,s.paid_amount,
                   s.payment_method,s.status,s.delivery_date,s.created_at,
                   coalesce((select round(sum(a.amount),2) from public.sales_payment_allocations a where a.sales_order_id=s.id and a.active=true),0) allocation_sum
            from public.sales_orders s where s.customer_external_id in(select code from codes) and s.status not in('cancelled','rejected')
          ), first_sales as (
            select distinct on(customer_external_id) customer_external_id,reference_no,sales_type,delivery_date,created_at
            from public.sales_orders where customer_external_id in(select code from codes) and status not in('cancelled','rejected')
            order by customer_external_id,coalesce(delivery_date,created_at::date),reference_no
          )
          select jsonb_pretty(jsonb_build_object(
            'ok',true,
            'source',coalesce((select jsonb_agg(to_jsonb(x) order by report_date,source_row_no) from source x),'[]'::jsonb),
            'events',coalesce((select jsonb_agg(to_jsonb(x) order by occurred_at,reference_no) from events x),'[]'::jsonb),
            'sales',coalesce((select jsonb_agg(to_jsonb(x) order by delivery_date,reference_no) from sales x),'[]'::jsonb),
            'firstSales',coalesce((select jsonb_agg(to_jsonb(x) order by customer_external_id) from first_sales x),'[]'::jsonb)
          ));
          SQL
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --file /tmp/inspect-concrete-exceptions.sql | tee concrete-payment-exceptions.json
          grep -q '"ok": true' concrete-payment-exceptions.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concrete-payment-exceptions-${{ github.run_id }}
          path: |
            concrete-payment-exceptions.json
            concrete-exceptions-connection.json
          retention-days: 7
      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{method:'POST',headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({state:process.env.JOB_STATUS==='success'?'success':'failure',context:'inspect-concrete-payment-exceptions',target_url:process.env.RUN_URL,description:'Concrete payment exception inspection completed.'})});
          if(!response.ok)throw new Error(`HTTP ${response.status}`);
          NODE