name: Apply concrete portfolio selection fix

on:
  push:
    paths:
      - '.github/workflows/apply-concrete-portfolio-selection-fix.yml'

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact concrete customer rule
        run: python scripts/apply-concrete-portfolio-selection-fix.py

      - name: Validate JavaScript and accounting rule
        shell: bash
        run: |
          node --check api/_lib/customer-settlement.js
          node --check api/_lib/customer-portfolio-pdf.js
          node --check api/_lib/customer-portfolio-document.js
          node --check shared/customer-portfolio-ownership.js
          node --input-type=module <<'NODE'
          import {buildReportActivityIndex,indexCustomerAnalytics,lookupCustomer,isEligibleConcreteAdvanceCollection,settleCustomerAccount} from './api/_lib/customer-settlement.js';
          import {resolveCustomerPortfolioOwner} from './shared/customer-portfolio-ownership.js';
          const cash={amount:750,date:'2026-07-21',paymentMethod:'cash'};
          const bank={amount:900,date:'2026-07-20',paymentMethod:'bank'};
          const old={amount:500,date:'2026-07-19',paymentMethod:'cash'};
          const other={amount:400,date:'2026-07-22',paymentMethod:'credit-note'};
          if(!isEligibleConcreteAdvanceCollection(cash)||!isEligibleConcreteAdvanceCollection(bank)||isEligibleConcreteAdvanceCollection(old)||isEligibleConcreteAdvanceCollection(other))throw new Error('cash/bank cutoff rule failed');
          if(lookupCustomer(indexCustomerAnalytics([]),'999','اختبار')!==null)throw new Error('synthetic concrete customer still exists');
          const activity=buildReportActivityIndex({collections:[{customerCode:'999',customerName:'عميل اختبار',amount:750,date:'2026-07-21',paymentMethod:'cash'}]},'concrete','2026-07-21').rows[0];
          if(!activity||activity.collectionRows[0].paymentMethod!=='cash')throw new Error('payment method was not preserved');
          const settlement=settleCustomerAccount({},activity,{reportDate:'2026-07-21'});
          if(settlement.finalDebt!==0||settlement.finalAdvance!==750)throw new Error('advance settlement failed');
          const unclassified=resolveCustomerPortfolioOwner({customer:{},employees:[],historySales:[],fallbackSector:''});
          const concreteSale=resolveCustomerPortfolioOwner({customer:{},employees:[],historySales:[],fallbackSector:'concrete'});
          if(unclassified.sector!==''||concreteSale.sector!=='concrete')throw new Error('ownership fallback rule failed');
          console.log('concrete portfolio rule verified');
          NODE

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-concrete-portfolio-selection-fix.yml scripts/apply-concrete-portfolio-selection-fix.py
          git add api/_lib/customer-settlement.js api/_lib/customer-portfolio-pdf.js api/_lib/customer-portfolio-document.js shared/customer-portfolio-ownership.js shared/canonical-declaration-texts.js shared/customer-portfolio-declaration.js
          git commit -m "تصحيح اختيار عملاء إقرار الخرسانة والسدادات المقدمة"
          git push origin HEAD:main
