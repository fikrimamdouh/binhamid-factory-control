name: Inspect sales summary send

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-sales-summary-send.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect one-off Telegram summary run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          runs_file="$(mktemp)"
          curl -fsSL "${auth[@]}" "${api}/actions/workflows/send-sales-summary-20260729-once.yml/runs?per_page=3" > "$runs_file"
          jq -r '.workflow_runs[]? | [.id,.event,.status,(.conclusion//"-"),.created_at,.updated_at,.head_sha] | @tsv' "$runs_file"
          run_id="$(jq -r '.workflow_runs[0].id // empty' "$runs_file")"
          test -n "$run_id"
          jobs_file="$(mktemp)"
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100" > "$jobs_file"
          jq -r '.jobs[] | [.id,.name,.status,(.conclusion//"-"),.started_at,.completed_at] | @tsv' "$jobs_file"
          jq -r '.jobs[] as $job | $job.steps[]? | [$job.name,.number,.name,.status,(.conclusion//"-")] | @tsv' "$jobs_file"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' "$runs_file")"
          test "$conclusion" = "success"
