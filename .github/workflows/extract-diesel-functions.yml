name: Extract exact diesel report functions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-diesel-functions.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract functions
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('legacy.html').read_text(errors='ignore')
          names=[]
          for m in re.finditer(r'function\s+(ops(?:Diesel|Fuel)[A-Za-z0-9_]*)\s*\(',src):
              if m.group(1) not in names:names.append(m.group(1))
          def extract(name):
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\(',src)
              if not m:return ''
              brace=src.find('{',m.end())
              if brace<0:return ''
              level=0; quote=None; esc=False
              for i in range(brace,len(src)):
                  c=src[i]
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                      continue
                  if c in "'\"`":quote=c;continue
                  if c=='{':level+=1
                  elif c=='}':
                      level-=1
                      if level==0:return src[m.start():i+1]
              return src[m.start():m.start()+12000]
          out=['=== FUNCTION NAMES ===','\n'.join(names)]
          for name in names:
              out += ['',f'=== {name} ===',extract(name)]
          Path('artifacts/diesel-functions.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          {
            echo '=== BOT FORMAT ==='
            cat api/_lib/bot-format.js
            echo
            echo '=== TELEGRAM IDENTITY HANDLER EXCERPTS ==='
            grep -RInE -A30 -B15 --exclude-dir=node_modules --exclude-dir=.git '(function.*identity|resolve.*identity|telegram_users|bot_users|warmAck|display_name|nickname|kunya|first_name|last_name)' api/_lib | head -n 2500 || true
          } > artifacts/nickname-functions.txt
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/diesel-functions.txt artifacts/nickname-functions.txt
          git commit -m "Extract exact diesel and nickname functions [skip ci]"
          git push origin main
          git rm .github/workflows/extract-diesel-functions.yml
          git commit -m "Remove temporary exact diesel extraction workflow [skip ci]"
          git push origin main
