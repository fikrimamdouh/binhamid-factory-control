name: Weekly report delivery check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/weekly-report-delivery-check.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: weekly-report-delivery-check
  cancel-in-progress: false

jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm Telegram delivery from the database log
        id: delivery
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const endpoint='https://binhamid-factory-control.vercel.app/api/router?route=weekly-report/status';
          const audience='binhamid-weekly-report-status';
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const required=(value,name)=>{if(!value)throw new Error(`Missing ${name}`);return value;};
          async function oidc(){
            const url=new URL(required(process.env.ACTIONS_ID_TOKEN_REQUEST_URL,'ACTIONS_ID_TOKEN_REQUEST_URL'));
            url.searchParams.set('audience',audience);
            const response=await fetch(url,{headers:{Authorization:`Bearer ${required(process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,'ACTIONS_ID_TOKEN_REQUEST_TOKEN')}`}});
            if(!response.ok)throw new Error(`OIDC ${response.status}`);
            return required((await response.json()).value,'OIDC token');
          }
          const since=new Date(Date.now()-2*60*60*1000).toISOString();
          let last='';
          for(let attempt=1;attempt<=36;attempt++){
            try{
              const token=await oidc();
              const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({since})});
              const text=await response.text();let data;try{data=text?JSON.parse(text):{};}catch{data={raw:text};}
              if(response.ok&&data?.ok&&data?.delivered){console.log(JSON.stringify(data,null,2));process.exit(0);}
              last=`HTTP ${response.status}: ${String(data?.error||data?.message||text||'not delivered yet').slice(0,500)}`;
            }catch(error){last=String(error?.message||error);}
            console.log(`[delivery-check] attempt ${attempt}/36: ${last}`);
            if(attempt<36)await wait(10000);
          }
          throw new Error(`Weekly report delivery was not confirmed: ${last}`);
          NODE

      - name: Publish weekly report delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        shell: bash
        run: |
          node <<'NODE'
          const success=process.env.DELIVERY_OUTCOME==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,{
            method:'POST',
            headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:success?'weekly-report:delivered':'weekly-report:failed',description:success?'Weekly executive report delivered to Telegram':'Weekly executive report delivery not confirmed',target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`})
          });
          if(!response.ok)throw new Error(`status publish failed: ${response.status} ${await response.text()}`);
          NODE

      - name: Fail when delivery was not confirmed
        if: steps.delivery.outcome != 'success'
        run: exit 1
