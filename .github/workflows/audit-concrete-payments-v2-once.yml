name: Audit Concrete Payments V2 Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-concrete-payments-v2-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: audit-concrete-payments-v2-once
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: concrete-payment-audit-v2-connection.json
        run: node scripts/resolve-supabase-connection.mjs

      - name: Audit concrete customer receipts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audit-concrete-payments-v2.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          set statement_timeout='180s';
          set client_min_messages=warning;

          with state as (
            select coalesce((select payload from public.app_state where key='primary' limit 1),'{}'::jsonb) payload
          ), legacy_employees as (
            select coalesce(nullif(e->>'id',''),nullif(e->>'external_id','')) employee_id,
                   concat_ws(' ',e->>'declarationRole',e->>'role',e->>'job',e->>'position') role_text
            from state,lateral jsonb_array_elements(coalesce(payload->'legacy'->'emp','[]'::jsonb)) e
          ), legacy_clients as (
            select coalesce(nullif(c->>'code',''),nullif(c->>'id',''),nullif(c->>'cr','')) customer_code,
                   coalesce(c->>'name','') customer_name,
                   coalesce(c->>'rep',c->>'repId',c->>'salesRepId',c->>'employeeId','') rep_id,
                   concat_ws(' ',c->>'primarySector',c->>'primary_sector',c->>'ownerSector',c->>'owner_sector',c->>'seg',c->>'segment',c->>'costCenter',c->>'cost_center') sector_text
            from state,lateral jsonb_array_elements(coalesce(payload->'legacy'->'cli','[]'::jsonb)) c
          ), assigned_concrete as (
            select distinct lc.customer_code
            from legacy_clients lc left join legacy_employees le on le.employee_id=lc.rep_id
            where lc.customer_code<>'' and (
              lc.sector_text ilike '%خرسان%' or lc.sector_text ilike '%concrete%' or lc.sector_text ilike '%ready mix%'
              or le.role_text ilike '%خرسان%' or le.role_text ilike '%concrete%' or le.role_text ilike '%ready mix%'
            )
          ), concrete_sales as (
            select distinct trim(coalesce(customer_external_id,'')) customer_code
            from public.sales_orders
            where sales_type='concrete' and status not in ('cancelled','rejected') and trim(coalesce(customer_external_id,''))<>''
            union
            select distinct trim(coalesce(l.customer_code,''))
            from public.daily_report_sales_lines l join public.daily_report_batches b on b.id=l.batch_id and b.status='approved'
            where l.sales_type='concrete' and trim(coalesce(l.customer_code,''))<>''
          ), scope_codes as (
            select customer_code from assigned_concrete union select customer_code from concrete_sales
          ), source_receipts as (
            select b.report_date,m.source_row_no,
                   concat('DR-',to_char(b.report_date,'YYYYMMDD'),'-C-',lpad(m.source_row_no::text,4,'0')) expected_reference,
                   trim(coalesce(m.account_code,'')) customer_code,trim(coalesce(m.account_name,'')) customer_name,
                   round(greatest(coalesce(m.debit,0),coalesce(m.credit,0))::numeric,2) amount,
                   trim(coalesce(m.voucher_no,'')) voucher_no
            from public.daily_report_cash_movements m
            join public.daily_report_batches b on b.id=m.batch_id and b.status='approved'
            where m.is_customer_collection=true
              and trim(coalesce(m.account_code,'')) in (select customer_code from scope_codes)
              and greatest(coalesce(m.debit,0),coalesce(m.credit,0))>0
          ), matched_source as (
            select s.*,
                   e.id event_id,e.reference_no actual_reference,e.customer_external_id event_customer_code,
                   round(coalesce(e.amount,0)::numeric,2) event_amount,e.status event_status,
                   case when e.reference_no=s.expected_reference then 'exact' when e.id is not null then 'fallback' else 'missing' end match_kind,
                   (select count(*) from public.collection_events x
                    where x.status not in ('cancelled','rejected','reversed')
                      and trim(coalesce(x.customer_external_id,''))=s.customer_code
                      and round(coalesce(x.amount,0)::numeric,2)=s.amount
                      and x.occurred_at::date=s.report_date
                      and (x.reference_no=s.expected_reference or s.voucher_no='' or coalesce(x.note,'') ilike concat('%',s.voucher_no,'%'))) candidate_count
            from source_receipts s
            left join lateral (
              select x.* from public.collection_events x
              where x.status not in ('cancelled','rejected','reversed')
                and trim(coalesce(x.customer_external_id,''))=s.customer_code
                and round(coalesce(x.amount,0)::numeric,2)=s.amount
                and x.occurred_at::date=s.report_date
                and (x.reference_no=s.expected_reference or s.voucher_no='' or coalesce(x.note,'') ilike concat('%',s.voucher_no,'%'))
              order by (x.reference_no=s.expected_reference) desc,x.created_at,x.id limit 1
            ) e on true
          ), source_issues as (
            select *,case
              when event_id is null then 'missing_collection_event'
              when event_customer_code<>customer_code then 'customer_code_mismatch'
              when event_amount<>amount then 'amount_mismatch'
              when event_status in ('cancelled','rejected','reversed') then 'inactive_collection_event'
              when candidate_count>1 then 'multiple_candidate_events'
              else null end issue
            from matched_source
          ), scoped_events as (
            select e.* from public.collection_events e
            where e.status not in ('cancelled','rejected','reversed')
              and trim(coalesce(e.customer_external_id,'')) in (select customer_code from scope_codes)
          ), allocation_by_collection as (
            select collection_id,round(coalesce(sum(amount) filter(where active=true),0)::numeric,2) allocation_sum,
                   count(*) filter(where active=true) allocation_count
            from public.sales_payment_allocations group by collection_id
          ), event_issues as (
            select e.id,e.reference_no,e.customer_external_id,e.customer_name,
                   round(coalesce(e.amount,0)::numeric,2) amount,
                   round(coalesce(e.allocated_amount,0)::numeric,2) allocated_amount,
                   round(coalesce(e.unallocated_amount,0)::numeric,2) unallocated_amount,
                   coalesce(a.allocation_sum,0) allocation_sum,coalesce(a.allocation_count,0) allocation_count,
                   case
                     when abs(round(coalesce(e.amount,0)::numeric,2)-round((coalesce(e.allocated_amount,0)+coalesce(e.unallocated_amount,0))::numeric,2))>0.01 then 'event_amount_split_mismatch'
                     when abs(round(coalesce(e.allocated_amount,0)::numeric,2)-coalesce(a.allocation_sum,0))>0.01 then 'allocation_sum_mismatch'
                     else null end issue
            from scoped_events e left join allocation_by_collection a on a.collection_id=e.id
          ), allocation_by_order as (
            select sales_order_id,round(coalesce(sum(amount) filter(where active=true),0)::numeric,2) allocation_sum,
                   count(*) filter(where active=true) allocation_count
            from public.sales_payment_allocations group by sales_order_id
          ), sale_issues as (
            select s.id,s.reference_no,s.customer_external_id,s.customer_name,s.sales_type,
                   round(coalesce(s.total_amount,0)::numeric,2) total_amount,
                   round(coalesce(s.paid_amount,0)::numeric,2) paid_amount,
                   coalesce(a.allocation_sum,0) allocation_sum,coalesce(a.allocation_count,0) allocation_count,
                   case when coalesce(a.allocation_count,0)>0 and abs(round(coalesce(s.paid_amount,0)::numeric,2)-coalesce(a.allocation_sum,0))>0.01 then 'sales_paid_allocation_mismatch' else null end issue
            from public.sales_orders s left join allocation_by_order a on a.sales_order_id=s.id
            where s.status not in ('cancelled','rejected')
              and trim(coalesce(s.customer_external_id,'')) in (select customer_code from scope_codes)
          ), cross_customer as (
            select a.id allocation_id,a.amount,e.reference_no collection_reference,e.customer_external_id collection_customer,
                   s.reference_no sales_reference,s.customer_external_id sales_customer
            from public.sales_payment_allocations a
            join public.collection_events e on e.id=a.collection_id
            join public.sales_orders s on s.id=a.sales_order_id
            where a.active=true and trim(coalesce(e.customer_external_id,''))<>trim(coalesce(s.customer_external_id,''))
              and (trim(coalesce(e.customer_external_id,'')) in (select customer_code from scope_codes)
                   or trim(coalesce(s.customer_external_id,'')) in (select customer_code from scope_codes))
          ), customer_totals as (
            select q.customer_code,
                   coalesce((select max(customer_name) from public.customers c where trim(coalesce(c.customer_code,c.external_id,''))=q.customer_code),'') customer_name,
                   coalesce((select round(sum(amount),2) from source_receipts s where s.customer_code=q.customer_code),0) source_amount,
                   coalesce((select round(sum(amount),2) from scoped_events e where trim(coalesce(e.customer_external_id,''))=q.customer_code),0) recorded_amount,
                   coalesce((select round(sum(allocated_amount),2) from scoped_events e where trim(coalesce(e.customer_external_id,''))=q.customer_code),0) allocated_amount,
                   coalesce((select round(sum(unallocated_amount),2) from scoped_events e where trim(coalesce(e.customer_external_id,''))=q.customer_code),0) unallocated_amount
            from scope_codes q
          )
          select jsonb_pretty(jsonb_build_object(
            'ok',(select count(*)=0 from source_issues where issue is not null)
                 and (select count(*)=0 from event_issues where issue is not null)
                 and (select count(*)=0 from sale_issues where issue is not null)
                 and (select count(*)=0 from cross_customer),
            'checkedAt',now(),
            'latestApprovedReportDate',(select max(report_date) from public.daily_report_batches where status='approved'),
            'scope',jsonb_build_object(
              'assignedConcreteCustomers',(select count(*) from assigned_concrete),
              'customersWithConcreteSales',(select count(*) from concrete_sales),
              'auditedCustomers',(select count(*) from scope_codes)
            ),
            'sourceReceipts',jsonb_build_object(
              'count',(select count(*) from source_receipts),
              'amount',(select coalesce(round(sum(amount),2),0) from source_receipts),
              'matched',(select count(*) from matched_source where event_id is not null),
              'exact',(select count(*) from matched_source where match_kind='exact'),
              'fallback',(select count(*) from matched_source where match_kind='fallback'),
              'issues',(select count(*) from source_issues where issue is not null)
            ),
            'collectionEvents',jsonb_build_object(
              'count',(select count(*) from scoped_events),
              'amount',(select coalesce(round(sum(amount),2),0) from scoped_events),
              'allocated',(select coalesce(round(sum(allocated_amount),2),0) from scoped_events),
              'unallocated',(select coalesce(round(sum(unallocated_amount),2),0) from scoped_events),
              'issues',(select count(*) from event_issues where issue is not null)
            ),
            'saleAllocationIssues',(select count(*) from sale_issues where issue is not null),
            'crossCustomerAllocations',(select count(*) from cross_customer),
            'sourceIssueRows',coalesce((select jsonb_agg(to_jsonb(x) order by report_date,source_row_no) from source_issues x where issue is not null),'[]'::jsonb),
            'eventIssueRows',coalesce((select jsonb_agg(to_jsonb(x) order by reference_no) from event_issues x where issue is not null),'[]'::jsonb),
            'saleIssueRows',coalesce((select jsonb_agg(to_jsonb(x) order by reference_no) from sale_issues x where issue is not null),'[]'::jsonb),
            'crossCustomerRows',coalesce((select jsonb_agg(to_jsonb(x) order by collection_reference,sales_reference) from cross_customer x),'[]'::jsonb),
            'dailySourceTotals',coalesce((select jsonb_agg(to_jsonb(x) order by report_date) from (select report_date,count(*) receipt_count,round(sum(amount),2) amount from source_receipts group by report_date) x),'[]'::jsonb),
            'customerTotals',coalesce((select jsonb_agg(to_jsonb(x) order by customer_code) from customer_totals x),'[]'::jsonb)
          ));
          SQL

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --file /tmp/audit-concrete-payments-v2.sql | tee concrete-payment-audit-v2.json
          test -s concrete-payment-audit-v2.json
          grep -q '"checkedAt"' concrete-payment-audit-v2.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concrete-payment-audit-v2-${{ github.run_id }}
          path: |
            concrete-payment-audit-v2.json
            concrete-payment-audit-v2-connection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish audit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:'audit-concrete-payments-v2',target_url:process.env.RUN_URL,description:success?'Concrete payment audit v2 completed.':'Concrete payment audit v2 failed.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE