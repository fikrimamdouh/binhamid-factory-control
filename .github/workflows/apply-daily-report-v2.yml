name: Apply daily report v2 parser

on:
  push:
    branches: [agent/daily-report-v2]
    paths:
      - .github/workflows/apply-daily-report-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-report-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate focused daily report behavior
        run: |
          node --check api/_lib/daily-summary-parser.js
          node --check api/erp/daily-report.js
          node --test tests/daily-report-v2-parser.test.mjs tests/erp-daily-sync.test.mjs
      - name: Run project tests
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/daily-summary-parser.js api/erp/daily-report.js tests/daily-report-v2-parser.test.mjs
          git commit -m "Read full treasury and bank movements from daily ERP reports"
          git push origin agent/daily-report-v2
