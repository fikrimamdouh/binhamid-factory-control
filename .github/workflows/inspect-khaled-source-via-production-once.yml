name: Inspect Khaled Source Via Production Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/ops/inspect-khaled-source.js'
      - '.github/workflows/inspect-khaled-source-via-production-once.yml'

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: inspect-khaled-source-via-production-once
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Call protected production inspector
        env:
          INSPECT_URL: https://binhamid-factory-control.vercel.app/api/ops/inspect-khaled-source
        shell: bash
        run: |
          set -euo pipefail
          get_token(){
            node --input-type=module <<'NODE'
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience','binhamid-khaled-source-inspect');
          const response=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if(!response.ok)throw new Error(`OIDC token request failed: ${response.status}`);
          const data=await response.json();
          if(!data.value)throw new Error('OIDC token value missing');
          process.stdout.write(data.value);
          NODE
          }

          for attempt in $(seq 1 24); do
            token=$(get_token)
            http_code=$(curl -sS -o khaled-source-evidence.json -w '%{http_code}' -X POST "${INSPECT_URL}" \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              --data '{}' || true)
            if [ "${http_code}" = '200' ] && jq -e '.ok == true' khaled-source-evidence.json >/dev/null 2>&1; then
              jq . khaled-source-evidence.json
              exit 0
            fi
            reason=$(jq -r '.error // .message // .code // empty' khaled-source-evidence.json 2>/dev/null || true)
            echo "Attempt ${attempt}/24: HTTP ${http_code}; ${reason:-waiting for production deployment}"
            sleep 15
          done
          echo 'Protected source inspection did not succeed after deployment retries.' >&2
          cat khaled-source-evidence.json >&2 || true
          exit 1

      - name: Upload source inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaled-source-production-${{ github.run_id }}
          path: khaled-source-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish inspection status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:'inspect-khaled-source-production',target_url:process.env.RUN_URL,description:success?'Original source evidence inspected.':'Original source inspection failed.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE
