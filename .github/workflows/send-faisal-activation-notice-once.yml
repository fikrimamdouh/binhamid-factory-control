name: Send Faisal Activation Notice Once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram activation notice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo 'TELEGRAM_BOT_TOKEN is empty'; exit 1; }
          test -n "${TELEGRAM_OWNER_ID:-}" || { echo 'TELEGRAM_OWNER_ID is empty'; exit 1; }
          text='<b>تم تفعيل حساب فيصل بنجاح</b>%0A%0Aالاسم: <b>فيصل سيد أحمد</b>%0AMعرف Telegram: <code>7017087649</code>%0Aالحالة: <b>نشط</b>%0Aالصلاحية: <b>الحضور والانصراف فقط</b>%0Aموقع الحضور: <b>المكتب</b>%0A%0Aتم ربط حسابه بسجل الموظف الصحيح واعتماد الحساب.'
          response=$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${text}")
          echo "$response" | grep -q '"ok":true'

      - name: Publish notification status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:success?'faisal-notice:sent':'faisal-notice:failed',target_url:process.env.RUN_URL,description:success?'Faisal activation notice sent to owner.':'Failed to send Faisal activation notice.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE
