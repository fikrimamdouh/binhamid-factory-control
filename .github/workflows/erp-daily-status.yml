name: ERP Daily Report Status

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/erp-daily-status.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Resolve authenticated database endpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const raw = String(process.env.SUPABASE_DB_URL || '').trim();
          if (!raw) throw new Error('SUPABASE_DB_URL_EMPTY');
          const configured = new URL(raw);
          const password = decodeURIComponent(configured.password);
          const probe = value => {
            const url = new URL(value);
            url.searchParams.set('sslmode', 'require');
            url.searchParams.set('connect_timeout', '5');
            const result = spawnSync('psql', [url.toString(), '-X', '-t', '-A', '-v', 'ON_ERROR_STOP=1', '-c', 'select 1;'], {
              encoding: 'utf8', env: process.env, timeout: 12000,
            });
            return result.status === 0 && String(result.stdout || '').trim() === '1' ? url.toString() : '';
          };
          let effective = '';
          if (configured.hostname.endsWith('.pooler.supabase.com')) effective = probe(configured.toString());
          if (!effective) {
            const match = configured.hostname.match(/^db\.([a-z0-9]+)\.supabase\.co$/i);
            if (!match) throw new Error('SUPABASE_HOST_UNSUPPORTED');
            const ref = match[1];
            const regions = [
              'us-east-1','eu-central-1','ap-southeast-1','us-west-1','us-west-2','us-east-2',
              'ca-central-1','eu-west-1','eu-west-2','eu-west-3','eu-central-2','eu-north-1',
              'ap-south-1','ap-northeast-1','ap-northeast-2','ap-southeast-2','sa-east-1'
            ];
            for (const cluster of ['0','1']) {
              for (const region of regions) {
                const candidate = new URL(configured.toString());
                candidate.protocol = 'postgresql:';
                candidate.username = `postgres.${ref}`;
                candidate.password = password;
                candidate.hostname = `aws-${cluster}-${region}.pooler.supabase.com`;
                candidate.port = '5432';
                effective = probe(candidate.toString());
                if (effective) break;
              }
              if (effective) break;
            }
          }
          if (!effective) throw new Error('DATABASE_ENDPOINT_NOT_RESOLVED');
          process.stdout.write(`::add-mask::${effective}\n`);
          appendFileSync(process.env.GITHUB_ENV, `EFFECTIVE_DB_URL=${effective}\n`, { mode: 0o600 });
          console.log('DATABASE_CONNECTION_READY');
          NODE

      - name: Inspect report dated 2026-08-01
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=15
          export PGOPTIONS='-c statement_timeout=30000'
          {
            echo 'ERP_DIAGNOSTIC_BEGIN'
            psql "$EFFECTIVE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 <<'SQL'
WITH target AS (
  SELECT id, report_date, status, committed_at, created_at, file_hash
  FROM daily_report_batches
  WHERE report_date = DATE '2026-08-01'
  ORDER BY committed_at DESC NULLS LAST, created_at DESC
  LIMIT 1
), sales AS (
  SELECT s.batch_id,
         COUNT(*) AS invoice_count,
         ROUND(COALESCE(SUM(s.amount),0),2) AS sales_total,
         ROUND(COALESCE(SUM(s.amount) FILTER (WHERE s.sales_type='block'),0),2) AS block_total,
         ROUND(COALESCE(SUM(s.amount) FILTER (WHERE s.sales_type='concrete'),0),2) AS concrete_total
  FROM daily_report_sales_lines s
  JOIN target t ON t.id=s.batch_id
  GROUP BY s.batch_id
), cash AS (
  SELECT c.batch_id,
         COUNT(*) FILTER (WHERE c.is_customer_collection) AS collection_rows,
         ROUND(COALESCE(SUM(c.debit-c.credit) FILTER (WHERE c.is_customer_collection),0),2) AS collections_total
  FROM daily_report_cash_movements c
  JOIN target t ON t.id=c.batch_id
  GROUP BY c.batch_id
)
SELECT 'TARGET', t.id::text, t.report_date::text, t.status::text,
       COALESCE(to_char(t.committed_at AT TIME ZONE 'Asia/Riyadh','YYYY-MM-DD HH24:MI:SS'),'NOT_COMMITTED'),
       COALESCE(s.invoice_count,0)::text, COALESCE(s.sales_total,0)::text,
       COALESCE(s.block_total,0)::text, COALESCE(s.concrete_total,0)::text,
       COALESCE(c.collection_rows,0)::text, COALESCE(c.collections_total,0)::text
FROM target t
LEFT JOIN sales s ON s.batch_id=t.id
LEFT JOIN cash c ON c.batch_id=t.id;

SELECT 'LATEST', report_date::text, status::text,
       COALESCE(to_char(committed_at AT TIME ZONE 'Asia/Riyadh','YYYY-MM-DD HH24:MI:SS'),'NOT_COMMITTED')
FROM daily_report_batches
ORDER BY report_date DESC, committed_at DESC NULLS LAST, created_at DESC
LIMIT 1;

SELECT 'IMPORT', id::text, status::text, original_name,
       COALESCE(last_error_code::text,''), COALESCE(last_error_message::text,''),
       to_char(created_at AT TIME ZONE 'Asia/Riyadh','YYYY-MM-DD HH24:MI:SS')
FROM imports
WHERE report_type IN ('daily_movement','block_daily_movement','concrete_daily_movement')
  AND created_at >= TIMESTAMPTZ '2026-08-01 00:00:00+03'
ORDER BY created_at DESC
LIMIT 10;
SQL
            echo 'ERP_DIAGNOSTIC_END'
          } | tee erp-diagnostic.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-diagnostic-${{ github.run_id }}
          path: erp-diagnostic.txt
          if-no-files-found: warn
          retention-days: 3
