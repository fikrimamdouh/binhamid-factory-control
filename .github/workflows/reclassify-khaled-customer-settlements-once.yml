name: Reclassify Khaled Customer Settlements Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reclassify-khaled-customer-settlements-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: reclassify-khaled-customer-settlements-once
  cancel-in-progress: false

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: khaled-reclassification-connection.json
        run: node scripts/resolve-supabase-connection.mjs

      - name: Reclassify the six customer settlements atomically
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reclassify-khaled.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          set statement_timeout='120s';
          set client_min_messages=warning;

          create temp table khaled_customer_settlements(
            source_batch_date date not null,
            source_date date not null,
            notification_voucher text not null,
            customer_code text not null,
            customer_name text not null,
            amount numeric(18,2) not null,
            reference_no text primary key,
            expected_net numeric(18,2) not null
          ) on commit drop;

          insert into khaled_customer_settlements values
            ('2026-07-23','2026-07-19','83','13197','مبارك ال مهري 0555720515',270.00,'EMP-KH-20260719-83',0.00),
            ('2026-07-23','2026-07-22','84','11776','جابر مسعد ضيف الله 0532101042',538.75,'EMP-KH-20260722-84',-0.75),
            ('2026-07-23','2026-07-23','85','13187','هادي المصعبي 0501104998',1450.00,'EMP-KH-20260723-85',0.29),
            ('2026-07-25','2026-07-25','87','12164','مؤسسة كيان اعمالي للمقاولات العامه / 0509904808',595.00,'EMP-KH-20260725-87',-285.25),
            ('2026-07-25','2026-07-25','86','13200','حلمي 0545150504',450.00,'EMP-KH-20260725-86',0.00),
            ('2026-07-25','2026-07-25','88','13201','ابو مانع 0503070544',1440.00,'EMP-KH-20260725-88',0.00);

          do $reclassify$
          declare
            r record;
            v_source_count integer;
            v_customer_count integer;
            v_event public.collection_events%rowtype;
            v_event_id public.collection_events.id%type;
          begin
            for r in select * from khaled_customer_settlements order by source_date,notification_voucher loop
              select count(*) into v_source_count
              from public.daily_report_cash_movements m
              join public.daily_report_batches b on b.id=m.batch_id
              where b.report_date=r.source_batch_date
                and m.account_code='1100048'
                and coalesce(m.voucher_no,'')=r.notification_voucher
                and round(coalesce(m.credit,0),2)=r.amount
                and round(coalesce(m.debit,0),2)=0
                and coalesce(m.movement_type,'') ilike '%دائن عميل%'
                and coalesce(nullif(m.movement_date_text,''),r.source_date::text)=r.source_date::text;
              if v_source_count<>1 then
                raise exception 'KHALED_SOURCE_NOTIFICATION_INVALID:%:%:%',r.notification_voucher,r.amount,v_source_count;
              end if;

              select count(*) into v_customer_count
              from public.customers c
              where c.active=true
                and (c.customer_code=r.customer_code or c.external_id=r.customer_code);
              if v_customer_count=0 then
                raise exception 'KHALED_TARGET_CUSTOMER_MISSING:%',r.customer_code;
              end if;

              select * into v_event
              from public.collection_events e
              where e.reference_no=r.reference_no
              limit 1;

              if found then
                if e.customer_external_id is null then null; end if;
                if v_event.customer_external_id<>r.customer_code
                   or round(coalesce(v_event.amount,0),2)<>r.amount then
                  raise exception 'KHALED_RECLASSIFICATION_REFERENCE_CONFLICT:%',r.reference_no;
                end if;
                continue;
              end if;

              insert into public.collection_events(
                reference_no,customer_external_id,customer_name,amount,payment_method,
                status,note,occurred_at,created_at
              ) values(
                r.reference_no,r.customer_code,r.customer_name,r.amount,'cash','recorded',
                concat('إعادة تصنيف إشعار عميل رقم ',r.notification_voucher,
                       ' كان مسجلاً على حساب خالد أحمد عبدالحكم 1100048؛ دون إنشاء حركة خزينة جديدة'),
                ((r.source_date::text||' 12:00:00+03')::timestamptz),
                ((r.source_date::text||' 12:00:00+03')::timestamptz)
              ) returning id into v_event_id;

              perform public.allocate_collection_fifo(v_event_id);

              insert into public.audit_log(
                actor_type,actor_id,action,entity_type,entity_id,details,created_at
              ) values(
                'system','github-actions','employee_held_customer_receipt_reclassified',
                'collection_event',v_event_id::text,
                jsonb_build_object(
                  'customer_code',r.customer_code,'customer_name',r.customer_name,
                  'amount',r.amount,'source_employee_code','1100048',
                  'source_notification_voucher',r.notification_voucher,
                  'source_date',r.source_date,'source_batch_date',r.source_batch_date,
                  'reference_no',r.reference_no,'cash_movement_created',false
                ),now()
              );
            end loop;
          end
          $reclassify$;

          do $verify$
          declare
            v_count integer;
            v_total numeric(18,2);
            v_bad integer;
          begin
            select count(*),round(sum(e.amount),2) into v_count,v_total
            from public.collection_events e
            join khaled_customer_settlements t on t.reference_no=e.reference_no;
            if v_count<>6 or v_total<>4743.75 then
              raise exception 'KHALED_RECLASSIFICATION_TOTAL_INVALID:%:%',v_count,v_total;
            end if;

            with balances as (
              select t.customer_code,t.expected_net,
                     round((
                       coalesce((select sum(o.balance) from public.customer_opening_balances o
                                 where coalesce(nullif(o.customer_code,''),nullif(o.client_id,''))=t.customer_code
                                   and (case when coalesce(o.balance_date,'') ~ '^\\d{4}-\\d{2}-\\d{2}$' then o.balance_date::date else '1900-01-01'::date end)<='2026-07-26'),0)
                       +coalesce((select sum(greatest(0,coalesce(s.total_amount,0)-coalesce(s.paid_amount,0))) from public.sales_orders s
                                 where s.customer_external_id=t.customer_code and s.status not in ('cancelled','rejected')
                                   and coalesce(s.delivery_date,s.created_at::date)<='2026-07-26'),0)
                       -coalesce((select sum(coalesce(e.unallocated_amount,0)) from public.collection_events e
                                 where e.customer_external_id=t.customer_code and e.status not in ('cancelled','rejected','reversed')
                                   and e.occurred_at::date<='2026-07-26'),0)
                     )::numeric,2) as net_balance
              from khaled_customer_settlements t
            )
            select count(*) into v_bad
            from balances
            where abs(net_balance-expected_net)>0.02;
            if v_bad<>0 then
              raise exception 'KHALED_RECLASSIFICATION_BALANCE_VERIFY_FAILED:%',v_bad;
            end if;
          end
          $verify$;

          with balances as (
            select t.customer_code,t.customer_name,t.amount,t.reference_no,t.expected_net,
                   round((
                     coalesce((select sum(o.balance) from public.customer_opening_balances o
                               where coalesce(nullif(o.customer_code,''),nullif(o.client_id,''))=t.customer_code
                                 and (case when coalesce(o.balance_date,'') ~ '^\\d{4}-\\d{2}-\\d{2}$' then o.balance_date::date else '1900-01-01'::date end)<='2026-07-26'),0)
                     +coalesce((select sum(greatest(0,coalesce(s.total_amount,0)-coalesce(s.paid_amount,0))) from public.sales_orders s
                               where s.customer_external_id=t.customer_code and s.status not in ('cancelled','rejected')
                                 and coalesce(s.delivery_date,s.created_at::date)<='2026-07-26'),0)
                     -coalesce((select sum(coalesce(e.unallocated_amount,0)) from public.collection_events e
                               where e.customer_external_id=t.customer_code and e.status not in ('cancelled','rejected','reversed')
                                 and e.occurred_at::date<='2026-07-26'),0)
                   )::numeric,2) net_balance
            from khaled_customer_settlements t
          )
          select jsonb_pretty(jsonb_build_object(
            'ok',true,
            'reclassifiedCount',(select count(*) from public.collection_events e join khaled_customer_settlements t on t.reference_no=e.reference_no),
            'reclassifiedAmount',(select round(sum(e.amount),2) from public.collection_events e join khaled_customer_settlements t on t.reference_no=e.reference_no),
            'cashMovementsCreated',0,
            'customers',(select jsonb_agg(to_jsonb(b) order by b.customer_code) from balances b)
          ));
          SQL

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction --file /tmp/reclassify-khaled.sql | tee khaled-reclassification-result.json
          test -s khaled-reclassification-result.json
          grep -q '"ok": true' khaled-reclassification-result.json

      - name: Upload reclassification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaled-customer-reclassification-${{ github.run_id }}
          path: |
            khaled-reclassification-result.json
            khaled-reclassification-connection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish reclassification status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:'khaled-customer-reclassification',target_url:process.env.RUN_URL,description:success?'Six customer settlements reclassified safely.':'Customer settlement reclassification failed.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE
