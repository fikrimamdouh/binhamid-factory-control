name: Extract diesel site excerpts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-diesel-site-excerpts.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract relevant code
        run: |
          mkdir -p artifacts
          {
            echo '=== LEGACY FUEL UI 6260-6520 ==='
            sed -n '6260,6520p' legacy.html
            echo
            echo '=== ALL opsDiesel FUNCTIONS ==='
            grep -n -A120 -B20 'function opsDiesel' legacy.html || true
            echo
            echo '=== ALL opsFuel REPORT FUNCTIONS ==='
            grep -n -A100 -B15 -E 'function opsFuel|opsDieselReport|DieselReport|fuel report|تقرير الديزل' legacy.html | head -n 2200 || true
            echo
            echo '=== BOT FORMAT GREETING ==='
            cat api/_lib/bot-format.js
            echo
            echo '=== IDENTITY SOURCES ==='
            grep -RInE --exclude-dir=.git --exclude-dir=node_modules '(identity\s*=|return\s*\{[^}]*role|displayName|display_name|nickname|kunya|telegram.*name|first_name|last_name|username)' api/_lib | head -n 1800 || true
            echo
            echo '=== KNOWN TELEGRAM USERS ==='
            grep -RInE --exclude-dir=.git --exclude-dir=node_modules '(6870312376|أبو فلاح|ابو فلاح|أبو مالك|ابو مالك|فكري ممدوح|مانع)' . | head -n 1000 || true
          } > artifacts/diesel-site-excerpts.txt
      - name: Commit excerpts and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/diesel-site-excerpts.txt
          git commit -m "Extract diesel site reports and nickname sources [skip ci]"
          git push origin main
          git rm .github/workflows/extract-diesel-site-excerpts.yml
          git commit -m "Remove temporary diesel excerpt workflow [skip ci]"
          git push origin main
