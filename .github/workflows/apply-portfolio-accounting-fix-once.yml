name: Finalize Customer Payment Allocation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-portfolio-accounting-fix-once.yml'

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply customer payment ownership fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch marker: {label}')
              return text.replace(old, new, 1)

          p = Path('api/_lib/bot-customer-report-data.js')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              "function agingBucket(days){if(days<=0)return'current';if(days<=30)return'days1to30';if(days<=60)return'days31to60';if(days<=90)return'days61to90';return'days90plus';}\n",
              "function agingBucket(days){if(days<=0)return'current';if(days<=30)return'days1to30';if(days<=60)return'days31to60';if(days<=90)return'days61to90';return'days90plus';}\nfunction applyCreditToAging(source={},amount=0){const aging={current:Math.max(0,n(source.current)),days1to30:Math.max(0,n(source.days1to30)),days31to60:Math.max(0,n(source.days31to60)),days61to90:Math.max(0,n(source.days61to90)),days90plus:Math.max(0,n(source.days90plus))};let remaining=Math.max(0,n(amount));for(const key of ['days90plus','days61to90','days31to60','days1to30','current']){const used=Math.min(remaining,aging[key]);aging[key]=money(aging[key]-used);remaining=money(remaining-used);if(remaining<=0)break;}return aging;}\n",
              'aging credit helper'
          )

          s = replace_once(
              s,
              "  };\n  const scopedKeys=new Set();\n",
              "  };\n  const sectorHints=new Map();\n  const addSectorHint=(key,sector)=>{if(!key||sector==='all')return;const set=sectorHints.get(key)||new Set();set.add(sector);sectorHints.set(key,set);};\n  for(const [key,agg] of aggregates)addSectorHint(key,segmentScope(agg.segment));\n  for(const row of openingBalances||[]){const key=resolve(row.customerCode||row.clientId,row.customerName),agg=aggregates.get(key);addSectorHint(key,segmentScope(row.segment||agg?.segment));}\n  for(const row of sales||[]){if(closedStatus.has(String(row.status||'')))continue;const key=resolve(row.customer_external_id,row.customer_name);addSectorHint(key,salesScope(row));}\n  const portfolioScope=(key,agg)=>{const explicit=segmentScope(agg?.segment);if(explicit!=='all')return explicit;const hints=sectorHints.get(key);if(hints?.size===1)return[...hints][0];return'concrete';};\n  const scopedKeys=new Set();\n",
              'portfolio ownership hints'
          )

          s = replace_once(
              s,
              "    if(scope==='all'||rowScope==='all'||rowScope===scope)scopedKeys.add(key);",
              "    const targetScope=rowScope!=='all'?rowScope:portfolioScope(key,agg);if(scope==='all'||targetScope===scope)scopedKeys.add(key);",
              'opening balance scope'
          )

          s = replace_once(
              s,
              "    if(closedStatus.has(String(row.status||'')))continue;const key=resolve(row.customer_external_id,row.customer_name,scope==='all');if(scope!=='all'&&!scopedKeys.has(key))continue;const agg=aggregates.get(key);if(!agg)continue;",
              "    if(closedStatus.has(String(row.status||'')))continue;const key=resolve(row.customer_external_id,row.customer_name,true),agg=aggregates.get(key);if(!agg)continue;const targetScope=portfolioScope(key,agg);if(scope!=='all'&&targetScope!==scope)continue;scopedKeys.add(key);",
              'collection portfolio scope'
          )

          s = replace_once(
              s,
              "    const overdue=money(item.aging.days1to30+item.aging.days31to60+item.aging.days61to90+item.aging.days90plus),netBalance=money(item.balance-item.unallocatedCredit),debitBalance=Math.max(0,netBalance),creditBalance=Math.max(0,-netBalance),utilization=item.creditLimit>0?debitBalance/item.creditLimit:null;",
              "    const reconciledCollectionCredit=Math.max(0,money(item.collections-item.paidApplied)),effectiveUnallocatedCredit=Math.max(item.unallocatedCredit,reconciledCollectionCredit),reconciledAging=applyCreditToAging(item.aging,effectiveUnallocatedCredit),overdue=money(reconciledAging.days1to30+reconciledAging.days31to60+reconciledAging.days61to90+reconciledAging.days90plus),netBalance=money(item.balance-effectiveUnallocatedCredit),debitBalance=Math.max(0,netBalance),creditBalance=Math.max(0,-netBalance),utilization=item.creditLimit>0?debitBalance/item.creditLimit:null;",
              'collection reconciliation'
          )

          s = replace_once(
              s,
              "    return{...item,overdue,netBalance,debitBalance,creditBalance,utilization,decision,customerClass,customerClassLabel:customerClass==='old'?'عميل قديم':'عميل جديد',products:[...item.products].slice(0,12),salesTypes:[...item.salesTypes],controlAlerts:[...item.controlAlerts]};",
              "    return{...item,unallocatedCredit:effectiveUnallocatedCredit,reconciledCollectionCredit,aging:reconciledAging,overdue,netBalance,debitBalance,creditBalance,utilization,decision,customerClass,customerClassLabel:customerClass==='old'?'عميل قديم':'عميل جديد',products:[...item.products].slice(0,12),salesTypes:[...item.salesTypes],controlAlerts:[...item.controlAlerts]};",
              'reconciled analytics row'
          )

          p.write_text(s, encoding='utf-8')

          test = Path('tests/customer-payment-portfolio-ownership.test.mjs')
          test.write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { buildCustomerAnalytics } from '../api/_lib/bot-customer-report-data.js';

const customers=[
  {external_id:'B1',customer_code:'B1',customer_name:'عميل بلوك',segment:'بلوك'},
  {external_id:'C1',customer_code:'C1',customer_name:'عميل خرسانة',segment:'خرسانة'}
];
const sales=[
  {reference_no:'SB1',customer_external_id:'B1',customer_name:'عميل بلوك',item:'بلوك',total_amount:100,paid_amount:0,status:'registered',delivery_date:'2026-07-29'},
  {reference_no:'SC1',customer_external_id:'C1',customer_name:'عميل خرسانة',item:'خرسانة',total_amount:200,paid_amount:0,status:'registered',delivery_date:'2026-07-29'}
];
const collections=[
  {reference_no:'PB1',customer_external_id:'B1',customer_name:'عميل بلوك',amount:30,allocated_amount:0,unallocated_amount:0,status:'recorded',occurred_at:'2026-07-29'},
  {reference_no:'PC1',customer_external_id:'C1',customer_name:'عميل خرسانة',amount:50,allocated_amount:0,unallocated_amount:0,status:'recorded',occurred_at:'2026-07-29'},
  {reference_no:'PU1',customer_external_id:'U1',customer_name:'سداد غير مصنف',amount:40,allocated_amount:0,unallocated_amount:0,status:'recorded',occurred_at:'2026-07-29'}
];

test('block portfolio keeps only block-owned payments and reconciles the balance',()=>{
  const result=buildCustomerAnalytics({customers,sales,collections,openingBalances:[],role:'block_sales',asOf:new Date('2026-07-30T00:00:00Z')});
  assert.deepEqual(result.rows.map(row=>row.code),['B1']);
  assert.equal(result.rows[0].grossSales,100);
  assert.equal(result.rows[0].collections,30);
  assert.equal(result.rows[0].netBalance,70);
});

test('concrete portfolio receives concrete and unclassified payments as advance credit',()=>{
  const result=buildCustomerAnalytics({customers,sales,collections,openingBalances:[],role:'concrete_sales',asOf:new Date('2026-07-30T00:00:00Z')});
  const byCode=new Map(result.rows.map(row=>[row.code,row]));
  assert.equal(byCode.get('C1').grossSales,200);
  assert.equal(byCode.get('C1').collections,50);
  assert.equal(byCode.get('C1').netBalance,150);
  assert.equal(byCode.get('U1').collections,40);
  assert.equal(byCode.get('U1').netBalance,-40);
  assert.equal(byCode.get('U1').creditBalance,40);
  assert.equal(byCode.has('B1'),false);
});
''',encoding='utf-8')
          PY
      - name: Validate payment and balance rules
        shell: bash
        run: |
          set -euo pipefail
          node --check api/_lib/bot-customer-report-data.js
          node --test tests/customer-payment-portfolio-ownership.test.mjs
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'portfolio-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/_lib/bot-customer-report-data.js tests/customer-payment-portfolio-ownership.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'ربط كل السدادات بمحفظة العميل وتصحيح الرصيد النهائي'
          git push origin HEAD:main
