name: Apply Portfolio Accounting Fix Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-portfolio-accounting-fix-once.yml'

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply prepared portfolio sources
        shell: bash
        run: |
          set -euo pipefail
          cat .github/portfolio-fix.part00 .github/portfolio-fix.part01 .github/portfolio-fix.part02 \
            | tr -d '\r\n ' \
            | base64 -d \
            | tar -xzf -
          python - <<'PY'
          from pathlib import Path
          p=Path('shared/canonical-declaration-texts.js')
          s=p.read_text(encoding='utf-8').replace('2026.07.22-original-v1','2026.07.30-accounting-columns-signature-v4')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate syntax and accounting contract
        shell: bash
        run: |
          set -euo pipefail
          node --check api/_lib/customer-portfolio-pdf.js
          node --check api/_lib/customer-portfolio-document.js
          node --check api/_lib/customer-settlement.js
          node --check shared/customer-portfolio-declaration.js
          node --check tests/customer-portfolio-debt-allocation.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { renderCustomerPortfolioDeclaration } from './shared/customer-portfolio-declaration.js';
          import { enhancePortfolioDocument } from './api/_lib/customer-portfolio-document.js';
          import { aggregateSettlements } from './api/_lib/customer-settlement.js';
          const rows=[
            {name:'مدين',code:'1',item:'خرسانة',previousNetBalance:100,previousBalance:100,previousCredit:0,reportSales:50,grossDue:150,reportCollections:20,paidCurrent:0,paidPrevious:20,finalDebt:130,finalBalance:130,finalAdvance:0,customerClass:'old',customerClassLabel:'قديم',statusLabel:'متبقي',sales:150,paid:20,outstanding:130,aging:{}},
            {name:'هللات',code:'2',item:'بلوك',previousNetBalance:.29,previousBalance:.29,previousCredit:0,reportSales:0,grossDue:.29,reportCollections:0,paidCurrent:0,paidPrevious:0,finalDebt:.29,finalBalance:.29,finalAdvance:0,customerClass:'old',customerClassLabel:'قديم',statusLabel:'هللات',aging:{}}
          ];
          const signedRows=rows.filter(row=>row.finalDebt>=.5);
          const declaration=renderCustomerPortfolioDeclaration({type:'concrete',companyName:'مصنع',employee:{name:'مندوب'},customers:signedRows,dateGregorian:'2026-07-29',logoUrl:'logo.png'}).document;
          const output=enhancePortfolioDocument(declaration,{type:'concrete',rows,unresolvedRows:[],employee:{name:'مندوب'},reportDate:'2026-07-29',sourceFile:'daily.xlsx',logoUrl:'logo.png',documentRef:'REF'});
          assert.match(output,/الرصيد السابق/);
          assert.match(output,/مشتريات (?:الفترة|التقرير)/);
          assert.match(output,/إجمالي المستحق/);
          assert.match(output,/فروق هللات مستبعدة/);
          const table=output.match(/<table class="led">[\s\S]*?<\/table>/)?.[0]||'';
          assert.match(table,/مدين/);
          assert.doesNotMatch(table,/هللات/);
          const totals=aggregateSettlements(rows);
          assert.equal(totals.previousNetBalance,100.29);
          assert.equal(totals.grossDue,150.29);
          JS
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'portfolio-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/_lib/customer-portfolio-pdf.js api/_lib/customer-portfolio-document.js api/_lib/customer-settlement.js shared/customer-portfolio-declaration.js shared/canonical-declaration-texts.js tests/customer-portfolio-debt-allocation.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'تصحيح عرض وحساب محفظتي البلوك والخرسانة'
          git push origin HEAD:main
      - name: Publish status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description='Portfolio accounting fix applied'
          git diff --exit-code >/dev/null 2>&1 || { state=failure; description='Portfolio accounting fix failed'; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='apply-portfolio-accounting-fix' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
