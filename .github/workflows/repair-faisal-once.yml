name: Repair Faisal Once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve authenticated Supabase Session pooler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {spawnSync}=require('node:child_process');
          const {appendFileSync}=require('node:fs');
          const raw=String(process.env.SUPABASE_DB_URL||'').trim();
          if(!raw)throw new Error('SUPABASE_DB_URL_EMPTY');
          const configured=new URL(raw);
          const probe=url=>{
            const target=new URL(url);target.searchParams.set('sslmode','require');target.searchParams.set('connect_timeout','4');
            const result=spawnSync('psql',[target.toString(),'-X','-t','-A','-v','ON_ERROR_STOP=1','-c','select 1;'],{encoding:'utf8',timeout:9000,stdio:['ignore','pipe','pipe']});
            return{ok:!result.error&&result.status===0&&String(result.stdout||'').trim()==='1',url:target.toString()};
          };
          let effective='';
          if(String(configured.hostname||'').endsWith('.pooler.supabase.com'))effective=probe(configured.toString()).ok?configured.toString():'';
          else{
            const match=String(configured.hostname||'').match(/^db\.([a-z0-9]+)\.supabase\.co$/i);
            if(!match)throw new Error('SUPABASE_DIRECT_HOST_INVALID');
            const ref=match[1],override=String(process.env.SUPABASE_POOLER_HOST||'').trim();
            const regions=['eu-central-1','ap-south-1','ap-southeast-1','me-central-1','us-east-1','us-west-1','us-west-2','us-east-2','ca-central-1','eu-west-1','eu-west-2','eu-west-3','eu-central-2','eu-north-1','ap-northeast-1','ap-northeast-2','ap-southeast-2','sa-east-1'];
            const hosts=[override,...regions.flatMap(region=>[`aws-0-${region}.pooler.supabase.com`,`aws-1-${region}.pooler.supabase.com`])].filter(Boolean);
            for(const host of [...new Set(hosts)]){
              const candidate=new URL(configured.toString());candidate.protocol='postgresql:';candidate.username=`postgres.${ref}`;candidate.hostname=host;candidate.port='5432';
              const checked=probe(candidate.toString());if(checked.ok){effective=checked.url;break;}
            }
          }
          if(!effective)throw new Error('SUPABASE_SESSION_POOLER_NOT_RESOLVED');
          process.stdout.write(`::add-mask::${effective}\n`);
          appendFileSync(process.env.GITHUB_ENV,`EFFECTIVE_DB_URL=${effective}\n`,{mode:0o600});
          console.log('Supabase Session pooler resolved.');
          NODE

      - name: Repair Faisal employee and Telegram linkage
        shell: bash
        run: |
          set -euo pipefail
          psql "$EFFECTIVE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $repair$
          declare
            v_employee public.employees%rowtype;
            v_employee_count integer;
            v_user_id uuid;
            v_office_id uuid;
            v_other_links integer;
            v_invitation_id uuid;
          begin
            select count(*) into v_employee_count
            from public.employees
            where active=true
              and regexp_replace(translate(trim(full_name),'أإآىة','ااايه'),'\s+',' ','g')='فيصل سيد احمد';
            if v_employee_count <> 1 then raise exception 'FAISAL_EMPLOYEE_MATCH_COUNT_%',v_employee_count; end if;

            select * into v_employee
            from public.employees
            where active=true
              and regexp_replace(translate(trim(full_name),'أإآىة','ااايه'),'\s+',' ','g')='فيصل سيد احمد'
            limit 1;

            select user_id into v_user_id
            from public.user_channels
            where channel='telegram' and external_id='7017087649'
            order by active desc,last_seen_at desc
            limit 1;
            if v_user_id is null then raise exception 'FAISAL_TELEGRAM_CHANNEL_NOT_FOUND'; end if;

            select count(*) into v_other_links
            from public.app_users
            where employee_external_id=v_employee.external_id
              and id<>v_user_id
              and active=true;
            if v_other_links>0 then raise exception 'FAISAL_EMPLOYEE_ALREADY_LINKED_TO_OTHER_ACTIVE_USER'; end if;

            update public.app_users
            set full_name=v_employee.full_name,
                employee_external_id=v_employee.external_id,
                role='accountant',
                active=true,
                updated_at=now()
            where id=v_user_id;
            if not found then raise exception 'FAISAL_APP_USER_NOT_FOUND'; end if;

            update public.user_capabilities
            set allowed=true
            where app_user_id=v_user_id and capability='accountant.preview';
            if not found then
              insert into public.user_capabilities(app_user_id,capability,allowed)
              values(v_user_id,'accountant.preview',true);
            end if;

            select id into v_office_id
            from public.work_sites
            where active=true
              and lower(coalesce(code,'')||' '||coalesce(name,'')||' '||coalesce(address,'')) ~ '(office|مكتب|اداري|إداري)'
            order by
              case when lower(coalesce(code,'')||' '||coalesce(name,'')||' '||coalesce(address,'')) ~ '(main office|head office|المكتب الرئيسي|المكاتب الاداريه|المكاتب الإدارية)' then 0 else 1 end,
              created_at asc
            limit 1;
            if v_office_id is null then raise exception 'OFFICE_WORK_SITE_NOT_FOUND'; end if;

            update public.employee_assignments
            set employee_external_id=v_employee.external_id,
                site_id=v_office_id,
                vehicle_external_id=null,
                active=true
            where app_user_id=v_user_id;
            if not found then
              insert into public.employee_assignments(app_user_id,employee_external_id,site_id,vehicle_external_id,active)
              values(v_user_id,v_employee.external_id,v_office_id,null,true);
            end if;

            select id into v_invitation_id
            from public.user_invitations
            where accepted_by_telegram_id='7017087649'
               or employee_external_id=v_employee.external_id
            order by created_at desc
            limit 1;

            if v_invitation_id is not null then
              update public.user_invitations
              set status='approved',
                  accepted_by_telegram_id='7017087649',
                  full_name=v_employee.full_name,
                  employee_external_id=v_employee.external_id,
                  requested_role='accountant',
                  approved_by=v_user_id::text,
                  approved_at=now(),
                  metadata=coalesce(metadata,'{}'::jsonb)||jsonb_build_object('accounting_preview',true,'one_time_employee_link',true,'fixed_employee_external_id',v_employee.external_id,'repaired_at',now(),'repair_method','github-ops-faisal')
              where id=v_invitation_id;
            end if;

            delete from public.bot_sessions
            where channel='telegram' and external_user_id='7017087649';

            insert into public.audit_log(actor_type,actor_id,action,entity_type,entity_id,details)
            values('system','github-ops-faisal','faisal_telegram_account_repaired','app_user',v_user_id::text,
              jsonb_build_object('telegram_id','7017087649','employee_external_id',v_employee.external_id,'employee_name',v_employee.full_name,'role','accountant','site_id',v_office_id,'invitation_id',v_invitation_id));
          end
          $repair$;
          commit;
          SQL

      - name: Publish repair status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:'success',context:'faisal-repair:active',target_url:process.env.RUN_URL,description:'Faisal is linked, active and assigned to the office.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE
