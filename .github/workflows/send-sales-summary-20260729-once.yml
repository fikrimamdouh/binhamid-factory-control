name: Send sales summary 2026-07-29 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/send-sales-summary-20260729-once.yml'
      - 'api/telegram/system-summary.js'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Send verified sales summary through the Bin Hamid system
        env:
          SYSTEM_SUMMARY_URL: https://binhamid-factory-control.vercel.app/api/telegram/system-summary
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n '{
            reportDate:"2026-07-29",
            sourceFile:"Daily-Report-2026-07-29.xlsx",
            noChanges:true,
            concreteQuantity:64,
            concreteSales:11649.93,
            blockQuantity:680,
            blockSales:1184.01,
            collections:15224
          }')

          get_token(){
            node --input-type=module <<'NODE'
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience','binhamid-system-notify');
          const response=await fetch(url,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if(!response.ok)throw new Error(`OIDC token request failed: ${response.status}`);
          const data=await response.json();
          if(!data.value)throw new Error('OIDC token value missing');
          process.stdout.write(data.value);
          NODE
          }

          for attempt in $(seq 1 20); do
            token=$(get_token)
            http_code=$(curl -sS -o response.json -w '%{http_code}' -X POST "${SYSTEM_SUMMARY_URL}" \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              --data "${payload}" || true)

            if [ "${http_code}" = '200' ] && jq -e '.ok == true' response.json >/dev/null 2>&1; then
              recipients=$(jq -r '.recipients // 0' response.json)
              duplicate=$(jq -r '.duplicate // false' response.json)
              {
                echo '## Sales summary delivery'
                echo "- Recipients: ${recipients}"
                echo "- Duplicate-safe result: ${duplicate}"
                echo '- Report date: 2026-07-29'
              } >> "$GITHUB_STEP_SUMMARY"
              cat response.json
              exit 0
            fi

            reason=$(jq -r '.error // .message // empty' response.json 2>/dev/null || true)
            echo "Attempt ${attempt}/20: HTTP ${http_code}; ${reason:-waiting for production deployment}"
            sleep 15
          done

          echo 'System summary delivery did not succeed after deployment retries.' >&2
          cat response.json >&2 || true
          exit 1
