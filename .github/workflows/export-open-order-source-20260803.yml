name: Export repair source

on:
  push:
    branches: [diagnose/july-failed-files-20260803]
    paths:
      - '.github/workflows/export-open-order-source-20260803.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-open-order-source-20260803.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source
        run: |
          mkdir -p source/api/_lib/routes source/api/_lib source/tests source/supabase/migrations source/scripts source/tools/erp-failed-review-agent
          cp api/_lib/routes/management.js source/api/_lib/routes/
          cp api/_lib/routes/erp-failed-retry-policy.js source/api/_lib/routes/
          cp api/_lib/bot-sales.js source/api/_lib/
          cp tests/telegram-master-data-persistence.test.mjs source/tests/
          cp tests/erp-failed-review-agent.test.mjs source/tests/
          cp supabase/migrations/029_daily_report_v2_upgrade.sql source/supabase/migrations/
          cp scripts/audit-migrations.mjs source/scripts/
          cp tools/erp-failed-review-agent/FailedReviewAgent.ps1 source/tools/erp-failed-review-agent/
          cp tools/erp-failed-review-agent/README.txt source/tools/erp-failed-review-agent/
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-${{ github.run_id }}
          path: source/
          retention-days: 3
