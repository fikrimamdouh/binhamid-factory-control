name: Audit Concrete Customer Payments Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-concrete-customer-payments-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: audit-concrete-customer-payments-once
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: concrete-payment-audit-connection.json
        run: node scripts/resolve-supabase-connection.mjs

      - name: Audit every concrete-customer receipt and allocation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audit-concrete-payments.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          set statement_timeout='180s';
          set client_min_messages=warning;

          create temp table audit_result(payload jsonb not null) on commit drop;

          with state as (
            select coalesce((select payload from public.app_state where key='primary' limit 1),'{}'::jsonb) payload
          ), legacy_employees as (
            select
              coalesce(nullif(e->>'id',''),nullif(e->>'external_id','')) employee_id,
              coalesce(e->>'declarationRole',e->>'role',e->>'job',e->>'position','') employee_role
            from state, lateral jsonb_array_elements(coalesce(payload->'legacy'->'emp','[]'::jsonb)) e
          ), legacy_clients as (
            select
              coalesce(nullif(c->>'code',''),nullif(c->>'id',''),nullif(c->>'cr','')) customer_code,
              coalesce(c->>'name','') customer_name,
              coalesce(c->>'rep',c->>'repId',c->>'salesRepId',c->>'employeeId','') rep_id,
              concat_ws(' ',c->>'primarySector',c->>'primary_sector',c->>'ownerSector',c->>'owner_sector',c->>'seg',c->>'segment',c->>'costCenter',c->>'cost_center') sector_text
            from state, lateral jsonb_array_elements(coalesce(payload->'legacy'->'cli','[]'::jsonb)) c
          ), sales_history as (
            select
              trim(coalesce(customer_external_id,'')) customer_code,
              trim(coalesce(customer_name,'')) customer_name,
              case when sales_type='concrete' then 'concrete' when sales_type='block' then 'block' else '' end sales_type,
              coalesce(delivery_date,created_at::date) sale_date,
              coalesce(reference_no,'') reference_no
            from public.sales_orders
            where status not in ('cancelled','rejected') and trim(coalesce(customer_external_id,''))<>''
            union all
            select
              trim(coalesce(l.customer_code,'')),trim(coalesce(l.customer_name,'')),
              case when l.sales_type='concrete' then 'concrete' when l.sales_type='block' then 'block' else '' end,
              b.report_date,coalesce(l.invoice_no,'')
            from public.daily_report_sales_lines l
            join public.daily_report_batches b on b.id=l.batch_id and b.status='approved'
            where trim(coalesce(l.customer_code,''))<>''
          ), first_sale as (
            select distinct on(customer_code) customer_code,sales_type,sale_date,reference_no
            from sales_history where sales_type<>''
            order by customer_code,sale_date nulls last,reference_no
          ), sale_flags as (
            select customer_code,
                   bool_or(sales_type='concrete') has_concrete_sale,
                   bool_or(sales_type='block') has_block_sale
            from sales_history group by customer_code
          ), customer_universe as (
            select trim(coalesce(customer_code,external_id,'')) customer_code,customer_name from public.customers where active=true
            union select customer_code,customer_name from legacy_clients where customer_code<>''
            union select customer_code,max(customer_name) from sales_history group by customer_code
          ), classified as (
            select distinct on(u.customer_code)
              u.customer_code,u.customer_name,
              case
                when lc.sector_text ilike '%خرسان%' or lc.sector_text ilike '%concrete%' or lc.sector_text ilike '%ready mix%' then 'concrete'
                when lc.sector_text ilike '%بلوك%' or lc.sector_text ilike '%بلك%' or lc.sector_text ilike '%block%' then 'block'
                when le.employee_role ilike '%خرسان%' or le.employee_role ilike '%concrete%' or le.employee_role ilike '%ready mix%' then 'concrete'
                when le.employee_role ilike '%بلوك%' or le.employee_role ilike '%بلك%' or le.employee_role ilike '%block%' then 'block'
                when fs.sales_type<>'' then fs.sales_type
                when coalesce(sf.has_concrete_sale,false) and not coalesce(sf.has_block_sale,false) then 'concrete'
                when coalesce(sf.has_block_sale,false) and not coalesce(sf.has_concrete_sale,false) then 'block'
                else ''
              end owner_sector,
              coalesce(sf.has_concrete_sale,false) has_concrete_sale,
              coalesce(sf.has_block_sale,false) has_block_sale
            from customer_universe u
            left join legacy_clients lc on lc.customer_code=u.customer_code
            left join legacy_employees le on le.employee_id=lc.rep_id
            left join first_sale fs on fs.customer_code=u.customer_code
            left join sale_flags sf on sf.customer_code=u.customer_code
            where u.customer_code<>''
            order by u.customer_code,
              case when lc.customer_name<>'' then 0 else 1 end,
              u.customer_name
          ), concrete_owned as (
            select customer_code from classified where owner_sector='concrete'
          ), concrete_related as (
            select customer_code from classified where has_concrete_sale=true
          ), concrete_scope as (
            select customer_code,'owned' scope_kind from concrete_owned
            union
            select customer_code,'related' from concrete_related
          ), source_receipts as (
            select
              b.report_date,m.source_row_no,
              concat('DR-',to_char(b.report_date,'YYYYMMDD'),'-C-',lpad(m.source_row_no::text,4,'0')) expected_reference,
              trim(coalesce(m.account_code,'')) customer_code,
              trim(coalesce(m.account_name,'')) customer_name,
              round(greatest(coalesce(m.debit,0),coalesce(m.credit,0))::numeric,2) amount,
              trim(coalesce(m.voucher_no,'')) voucher_no,
              trim(coalesce(m.payment_method,'')) payment_method
            from public.daily_report_cash_movements m
            join public.daily_report_batches b on b.id=m.batch_id and b.status='approved'
            where m.is_customer_collection=true
              and trim(coalesce(m.account_code,'')) in (select customer_code from concrete_scope)
              and greatest(coalesce(m.debit,0),coalesce(m.credit,0))>0
          ), source_matches as (
            select s.*,
              e.id event_id,e.reference_no actual_reference,e.customer_external_id event_customer_code,
              round(coalesce(e.amount,0)::numeric,2) event_amount,e.status event_status,
              case when e.reference_no=s.expected_reference then 'exact' else 'fallback' end match_kind,
              (select count(*) from public.collection_events x
               where x.status not in ('cancelled','rejected','reversed')
                 and trim(coalesce(x.customer_external_id,''))=s.customer_code
                 and round(coalesce(x.amount,0)::numeric,2)=s.amount
                 and x.occurred_at::date=s.report_date
                 and (x.reference_no=s.expected_reference or s.voucher_no='' or coalesce(x.note,'') ilike concat('%',s.voucher_no,'%'))
              ) candidate_count
            from source_receipts s
            left join lateral (
              select x.*
              from public.collection_events x
              where x.status not in ('cancelled','rejected','reversed')
                and trim(coalesce(x.customer_external_id,''))=s.customer_code
                and round(coalesce(x.amount,0)::numeric,2)=s.amount
                and x.occurred_at::date=s.report_date
                and (x.reference_no=s.expected_reference or s.voucher_no='' or coalesce(x.note,'') ilike concat('%',s.voucher_no,'%'))
              order by (x.reference_no=s.expected_reference) desc,x.created_at,x.id
              limit 1
            ) e on true
          ), source_issues as (
            select *,case
              when event_id is null then 'missing_collection_event'
              when event_customer_code<>customer_code then 'customer_code_mismatch'
              when event_amount<>amount then 'amount_mismatch'
              when event_status in ('cancelled','rejected','reversed') then 'inactive_collection_event'
              when candidate_count>1 then 'multiple_candidate_events'
              else null end issue
            from source_matches
          ), scoped_events as (
            select e.*
            from public.collection_events e
            where e.status not in ('cancelled','rejected','reversed')
              and trim(coalesce(e.customer_external_id,'')) in (select customer_code from concrete_scope)
          ), allocation_sums as (
            select collection_id,round(coalesce(sum(amount) filter(where active=true),0)::numeric,2) allocation_sum,
                   count(*) filter(where active=true) allocation_count
            from public.sales_payment_allocations group by collection_id
          ), event_allocation_issues as (
            select e.id,e.reference_no,e.customer_external_id,e.customer_name,
                   round(coalesce(e.amount,0)::numeric,2) amount,
                   round(coalesce(e.allocated_amount,0)::numeric,2) allocated_amount,
                   round(coalesce(e.unallocated_amount,0)::numeric,2) unallocated_amount,
                   coalesce(a.allocation_sum,0) allocation_sum,coalesce(a.allocation_count,0) allocation_count,
                   case
                     when abs(round(coalesce(e.amount,0)::numeric,2)-round((coalesce(e.allocated_amount,0)+coalesce(e.unallocated_amount,0))::numeric,2))>0.01 then 'event_amount_split_mismatch'
                     when abs(round(coalesce(e.allocated_amount,0)::numeric,2)-coalesce(a.allocation_sum,0))>0.01 then 'allocation_sum_mismatch'
                     else null end issue
            from scoped_events e left join allocation_sums a on a.collection_id=e.id
          ), order_allocation_sums as (
            select sales_order_id,round(coalesce(sum(amount) filter(where active=true),0)::numeric,2) allocation_sum,
                   count(*) filter(where active=true) allocation_count
            from public.sales_payment_allocations group by sales_order_id
          ), sales_allocation_issues as (
            select s.id,s.reference_no,s.customer_external_id,s.customer_name,s.sales_type,
                   round(coalesce(s.total_amount,0)::numeric,2) total_amount,
                   round(coalesce(s.paid_amount,0)::numeric,2) paid_amount,
                   coalesce(a.allocation_sum,0) allocation_sum,coalesce(a.allocation_count,0) allocation_count,
                   case when coalesce(a.allocation_count,0)>0 and abs(round(coalesce(s.paid_amount,0)::numeric,2)-coalesce(a.allocation_sum,0))>0.01 then 'sales_paid_allocation_mismatch' else null end issue
            from public.sales_orders s
            left join order_allocation_sums a on a.sales_order_id=s.id
            where s.status not in ('cancelled','rejected')
              and trim(coalesce(s.customer_external_id,'')) in (select customer_code from concrete_scope)
          ), cross_customer_allocations as (
            select a.id allocation_id,a.amount,e.reference_no collection_reference,e.customer_external_id collection_customer,s.reference_no sales_reference,s.customer_external_id sales_customer
            from public.sales_payment_allocations a
            join public.collection_events e on e.id=a.collection_id
            join public.sales_orders s on s.id=a.sales_order_id
            where a.active=true and trim(coalesce(e.customer_external_id,''))<>trim(coalesce(s.customer_external_id,''))
              and (trim(coalesce(e.customer_external_id,'')) in (select customer_code from concrete_scope)
                   or trim(coalesce(s.customer_external_id,'')) in (select customer_code from concrete_scope))
          ), per_customer as (
            select c.customer_code,max(c.customer_name) customer_name,max(c.owner_sector) owner_sector,
              coalesce((select round(sum(sr.amount),2) from source_receipts sr where sr.customer_code=c.customer_code),0) source_receipts,
              coalesce((select round(sum(e.amount),2) from scoped_events e where trim(coalesce(e.customer_external_id,''))=c.customer_code),0) recorded_collections,
              coalesce((select round(sum(e.allocated_amount),2) from scoped_events e where trim(coalesce(e.customer_external_id,''))=c.customer_code),0) allocated,
              coalesce((select round(sum(e.unallocated_amount),2) from scoped_events e where trim(coalesce(e.customer_external_id,''))=c.customer_code),0) unallocated
            from classified c
            where c.customer_code in (select customer_code from concrete_scope)
            group by c.customer_code
          )
          insert into audit_result(payload)
          select jsonb_build_object(
            'ok',
              (select count(*)=0 from source_issues where issue is not null)
              and (select count(*)=0 from event_allocation_issues where issue is not null)
              and (select count(*)=0 from sales_allocation_issues where issue is not null)
              and (select count(*)=0 from cross_customer_allocations),
            'checkedAt',now(),
            'latestApprovedReportDate',(select max(report_date) from public.daily_report_batches where status='approved'),
            'scope',jsonb_build_object(
              'concreteOwnedCustomers',(select count(*) from concrete_owned),
              'customersWithConcreteSales',(select count(*) from concrete_related),
              'auditedCustomerCodes',(select count(distinct customer_code) from concrete_scope)
            ),
            'sourceReceipts',jsonb_build_object(
              'count',(select count(*) from source_receipts),
              'amount',(select coalesce(round(sum(amount),2),0) from source_receipts),
              'matchedCount',(select count(*) from source_matches where event_id is not null),
              'exactMatchCount',(select count(*) from source_matches where match_kind='exact'),
              'fallbackMatchCount',(select count(*) from source_matches where match_kind='fallback'),
              'issueCount',(select count(*) from source_issues where issue is not null)
            ),
            'recordedCollections',jsonb_build_object(
              'count',(select count(*) from scoped_events),
              'amount',(select coalesce(round(sum(amount),2),0) from scoped_events),
              'allocated',(select coalesce(round(sum(allocated_amount),2),0) from scoped_events),
              'unallocated',(select coalesce(round(sum(unallocated_amount),2),0) from scoped_events),
              'allocationIssueCount',(select count(*) from event_allocation_issues where issue is not null)
            ),
            'salesAllocationIssueCount',(select count(*) from sales_allocation_issues where issue is not null),
            'crossCustomerAllocationCount',(select count(*) from cross_customer_allocations),
            'sourceIssues',coalesce((select jsonb_agg(to_jsonb(x) order by report_date,source_row_no) from source_issues x where issue is not null),'[]'::jsonb),
            'eventAllocationIssues',coalesce((select jsonb_agg(to_jsonb(x) order by reference_no) from event_allocation_issues x where issue is not null),'[]'::jsonb),
            'salesAllocationIssues',coalesce((select jsonb_agg(to_jsonb(x) order by reference_no) from sales_allocation_issues x where issue is not null),'[]'::jsonb),
            'crossCustomerAllocations',coalesce((select jsonb_agg(to_jsonb(x) order by collection_reference,sales_reference) from cross_customer_allocations x),'[]'::jsonb),
            'perCustomer',coalesce((select jsonb_agg(to_jsonb(x) order by customer_code) from per_customer x),'[]'::jsonb),
            'dailySourceTotals',coalesce((select jsonb_agg(to_jsonb(x) order by report_date) from (select report_date,count(*) receipt_count,round(sum(amount),2) amount from source_receipts group by report_date) x),'[]'::jsonb)
          );

          select jsonb_pretty(payload) from audit_result;
          SQL

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --file /tmp/audit-concrete-payments.sql | tee concrete-payment-audit.json
          test -s concrete-payment-audit.json
          grep -q '"checkedAt"' concrete-payment-audit.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concrete-customer-payment-audit-${{ github.run_id }}
          path: |
            concrete-payment-audit.json
            concrete-payment-audit-connection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish audit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:'audit-concrete-customer-payments',target_url:process.env.RUN_URL,description:success?'Concrete customer payment audit completed.':'Concrete customer payment audit failed.'})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE