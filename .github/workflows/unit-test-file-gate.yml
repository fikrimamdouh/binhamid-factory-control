name: Unit Test File Gate

on:
  pull_request:
  push:
    branches:
      - main
      - fix/final-acceptance-hardening

permissions:
  contents: read
  statuses: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Vercel build chain
        run: npm run vercel-build
      - name: Validate driver registration wiring
        run: |
          node scripts/apply-driver-self-registration-v2.mjs
          node --check api/_lib/bot-driver-pool-registration.js
          node --check api/_lib/bot-invitations.js
          node --check api/_lib/telegram-webhook-gateway.js
          node --input-type=module -e "await import('./api/_lib/bot-driver-pool-registration.js'); await import('./api/_lib/bot-invitations.js'); await import('./api/_lib/telegram-webhook-gateway.js');"
      - name: Run each test file
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p test-evidence
          failed=''
          for file in $(find tests -maxdepth 1 -name '*.test.mjs' -print | sort); do
            echo "Testing $file"
            if ! node --test "$file"; then
              failed="$file"
              break
            fi
          done
          printf '%s\n' "${failed:-all-tests-passed}" > test-evidence/result.txt
          test -z "$failed"
      - name: Publish file-level test status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          import { existsSync,readFileSync } from 'node:fs';
          const raw=existsSync('test-evidence/result.txt')?readFileSync('test-evidence/result.txt','utf8').trim():'driver-wiring-failed';
          const label=raw.split('/').pop().replace(/[^A-Za-z0-9_.-]/g,'-').slice(0,65);
          const success=process.env.JOB_STATUS==='success';
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.HEAD_SHA}`,{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify({state:success?'success':'failure',context:`unit-tests:${label}`,target_url:process.env.RUN_URL,description:success?'Driver wiring, Vercel build and Node tests passed.':`Build or test failure: ${label}`})
          });
          if(!response.ok)throw new Error(`Status publication failed with HTTP ${response.status}`);
          NODE

  emergency_vehicle_balance:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[RUN_FUEL_BALANCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_VEHICLES_URL: https://www.norkhoysa.com/companies/vehicles
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      FUEL_SYNC_MODE: vehicle-balance-report
      FUEL_SYNC_ARTIFACT_DIR: artifacts/emergency-vehicle-balance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Check whether today's balance was already delivered
        id: delivery_status
        env:
          FUEL_STATUS_KIND: vehicle-balance-report
          FUEL_STATUS_DATE_OFFSET_DAYS: '0'
        run: node scripts/check-fuel-delivery-status.mjs
      - name: Record already delivered
        if: steps.delivery_status.outputs.needed == 'false'
        run: echo "Vehicle balance already delivered at ${{ steps.delivery_status.outputs.delivered_at }}."
      - name: Install project dependencies
        if: steps.delivery_status.outputs.needed != 'false'
        run: npm ci
      - name: Install Chromium
        if: steps.delivery_status.outputs.needed != 'false'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Read Noor Khoy and deliver diesel balance
        if: steps.delivery_status.outputs.needed != 'false'
        run: node scripts/noor-khoy-fuel-sync.mjs
      - name: Keep execution evidence
        if: always() && steps.delivery_status.outputs.needed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: emergency-vehicle-balance-${{ github.run_id }}
          path: artifacts/emergency-vehicle-balance/
          if-no-files-found: ignore
          retention-days: 7
