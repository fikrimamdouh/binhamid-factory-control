name: Noor Khoy daily fuel sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional single report date (YYYY-MM-DD)
        required: false
        type: string
      start_date:
        description: Optional backfill start date (YYYY-MM-DD)
        required: false
        type: string
      end_date:
        description: Optional backfill end date (YYYY-MM-DD); defaults to previous Riyadh day
        required: false
        type: string
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: noor-khoy-daily-fuel-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fuel-initial-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_REPORT_URL: https://www.norkhoysa.com/companies/fuels?fueltype=all
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_START_DATE: ${{ github.event_name == 'push' && '2026-07-01' || inputs.start_date }}
      REPORT_END_DATE: ${{ github.event_name == 'push' && '2026-07-26' || inputs.end_date }}
      FUEL_REPORT_DATE_OFFSET_DAYS: '-1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Download and upload fuel reports
        id: fuel_import
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/noor-khoy-fuel
          : > artifacts/noor-khoy-fuel/execution.log
          if [[ -n "${REPORT_START_DATE:-}" ]]; then
            start="${REPORT_START_DATE}"
            end="${REPORT_END_DATE:-$(TZ=Asia/Riyadh date -d 'yesterday' +%F)}"
            date -d "$start" +%F >/dev/null
            date -d "$end" +%F >/dev/null
            if [[ "$start" > "$end" ]]; then
              echo "start_date must not be after end_date" | tee -a artifacts/noor-khoy-fuel/execution.log >&2
              exit 2
            fi
            current="$start"
            while [[ "$current" < "$end" || "$current" == "$end" ]]; do
              final_day=false
              [[ "$current" == "$end" ]] && final_day=true
              echo "Importing Noor Khoy fuel report for $current" | tee -a artifacts/noor-khoy-fuel/execution.log
              REPORT_DATE="$current" \
              FUEL_SEND_BALANCE="$final_day" \
              FUEL_NOTIFY="$final_day" \
              FUEL_SYNC_ARTIFACT_DIR="artifacts/noor-khoy-fuel/$current" \
              node scripts/noor-khoy-fuel-sync.mjs 2>&1 | tee -a artifacts/noor-khoy-fuel/execution.log
              current="$(date -I -d "$current + 1 day")"
            done
          else
            FUEL_SEND_BALANCE=true FUEL_NOTIFY=true node scripts/noor-khoy-fuel-sync.mjs 2>&1 | tee -a artifacts/noor-khoy-fuel/execution.log
          fi
      - name: Publish execution status
        if: always()
        shell: bash
        env:
          IMPORT_OUTCOME: ${{ steps.fuel_import.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .github/fuel-sync-status
          python - <<'PY'
          import json, os, pathlib, datetime
          root=pathlib.Path('artifacts/noor-khoy-fuel')
          failures=sorted(root.glob('*/failure-context.json'))
          responses=sorted(root.glob('*/upload-response.json'))
          diagnostics=[]
          for p in failures[-3:]:
              try: diagnostics.append({'file':str(p),'data':json.loads(p.read_text(encoding='utf-8'))})
              except Exception as e: diagnostics.append({'file':str(p),'error':str(e)})
          uploads=[]
          for p in responses[-5:]:
              try: uploads.append({'file':str(p),'data':json.loads(p.read_text(encoding='utf-8'))})
              except Exception as e: uploads.append({'file':str(p),'error':str(e)})
          log=''
          lp=root/'execution.log'
          if lp.exists(): log='\n'.join(lp.read_text(encoding='utf-8',errors='replace').splitlines()[-80:])
          payload={'outcome':os.environ.get('IMPORT_OUTCOME','unknown'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'commit':os.environ.get('GITHUB_SHA'),'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'diagnostics':diagnostics,'uploads':uploads,'log_tail':log}
          pathlib.Path('.github/fuel-sync-status/latest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/fuel-sync-status/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record fuel sync status [skip ci]"
            git push origin HEAD:main
          fi
      - name: Keep diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-khoy-fuel-${{ github.run_id }}
          path: artifacts/noor-khoy-fuel/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when fuel import failed
        if: steps.fuel_import.outcome != 'success'
        run: exit 1
