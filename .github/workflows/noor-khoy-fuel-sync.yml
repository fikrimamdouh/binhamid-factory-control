name: Noor Khoy daily fuel sync
# One-time verification trigger for the corrected vehicle balance.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional single report date (YYYY-MM-DD)
        required: false
        type: string
      start_date:
        description: Optional period start date (YYYY-MM-DD)
        required: false
        type: string
      end_date:
        description: Optional period end date (YYYY-MM-DD)
        required: false
        type: string
      run_vehicle_balance:
        description: Send the vehicle diesel balance report instead of the daily fuel import
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 16 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: noor-khoy-daily-fuel-sync
  cancel-in-progress: true

jobs:
  sync:
    if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[fuel-initial-backfill]')) && github.event.schedule != '0 16 * * *' && !(github.event_name == 'workflow_dispatch' && inputs.run_vehicle_balance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_REPORT_URL: https://www.norkhoysa.com/companies/fuels?fueltype=all
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_START_DATE: ${{ github.event_name == 'push' && '2026-07-01' || inputs.start_date }}
      REPORT_END_DATE: ${{ github.event_name == 'push' && '2026-07-26' || inputs.end_date }}
      FUEL_REPORT_DATE_OFFSET_DAYS: '-1'
      FUEL_SEND_BALANCE: 'true'
      FUEL_NOTIFY: ${{ github.event_name == 'push' && 'false' || 'true' }}
      FUEL_SYNC_ARTIFACT_DIR: artifacts/noor-khoy-fuel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Download and upload fuel report
        id: fuel_import
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/noor-khoy-fuel
          node scripts/noor-khoy-fuel-sync.mjs 2>&1 | tee artifacts/noor-khoy-fuel/execution.log
      - name: Publish execution status
        if: always()
        shell: bash
        env:
          IMPORT_OUTCOME: ${{ steps.fuel_import.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .github/fuel-sync-status
          python - <<'PY'
          import json, os, pathlib, datetime
          root=pathlib.Path('artifacts/noor-khoy-fuel')
          diagnostics=[]
          for p in sorted(root.glob('failure-context.json')):
              try: diagnostics.append({'file':str(p),'data':json.loads(p.read_text(encoding='utf-8'))})
              except Exception as e: diagnostics.append({'file':str(p),'error':str(e)})
          uploads=[]
          for p in sorted(root.glob('upload-response.json')):
              try: uploads.append({'file':str(p),'data':json.loads(p.read_text(encoding='utf-8'))})
              except Exception as e: uploads.append({'file':str(p),'error':str(e)})
          lp=root/'execution.log'
          log='\n'.join(lp.read_text(encoding='utf-8',errors='replace').splitlines()[-200:]) if lp.exists() else ''
          payload={'outcome':os.environ.get('IMPORT_OUTCOME','unknown'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'commit':os.environ.get('GITHUB_SHA'),'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'diagnostics':diagnostics,'uploads':uploads,'log_tail':log}
          pathlib.Path('.github/fuel-sync-status/latest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/fuel-sync-status/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record fuel sync status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep fuel workbook and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-khoy-fuel-${{ github.run_id }}
          path: artifacts/noor-khoy-fuel/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when fuel import failed
        if: steps.fuel_import.outcome != 'success'
        run: exit 1

  vehicle-balance-report:
    if: github.event.schedule == '0 16 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run_vehicle_balance) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vehicle-balance-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_VEHICLES_URL: https://www.norkhoysa.com/companies/vehicles
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      FUEL_SYNC_MODE: vehicle-balance-report
      FUEL_SYNC_ARTIFACT_DIR: artifacts/noor-khoy-vehicle-balance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Sum vehicle diesel balances and send Telegram report
        run: node scripts/noor-khoy-fuel-sync.mjs
      - name: Keep balance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-khoy-vehicle-balance-${{ github.run_id }}
          path: artifacts/noor-khoy-vehicle-balance/
          if-no-files-found: ignore
          retention-days: 7
