name: Noor Khoy daily fuel sync

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional single report date (YYYY-MM-DD)
        required: false
        type: string
      start_date:
        description: Optional period start date (YYYY-MM-DD)
        required: false
        type: string
      end_date:
        description: Optional period end date (YYYY-MM-DD)
        required: false
        type: string
      run_vehicle_balance:
        description: Send the vehicle diesel balance report instead of the daily fuel import
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '7 5 * * *'
    - cron: '19 5 * * *'
    - cron: '31 5 * * *'
    - cron: '43 5 * * *'
    - cron: '55 5 * * *'
    - cron: '7 16 * * *'
    - cron: '19 16 * * *'
    - cron: '31 16 * * *'
    - cron: '43 16 * * *'
    - cron: '55 16 * * *'
    - cron: '10 22 6 8 *'
    - cron: '15 22 6 8 *'
    - cron: '20 22 6 8 *'

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: >-
      !(
        github.event_name == 'schedule' &&
        contains(fromJSON('["7 16 * * *","19 16 * * *","31 16 * * *","43 16 * * *","55 16 * * *","10 22 6 8 *","15 22 6 8 *","20 22 6 8 *"]'), github.event.schedule)
      ) &&
      !(github.event_name == 'workflow_dispatch' && inputs.run_vehicle_balance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_REPORT_URL: https://www.norkhoysa.com/companies/fuels?fueltype=all
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_START_DATE: ${{ inputs.start_date }}
      REPORT_END_DATE: ${{ inputs.end_date }}
      FUEL_REPORT_DATE_OFFSET_DAYS: '-1'
      FUEL_SEND_BALANCE: 'true'
      FUEL_NOTIFY: 'true'
      FUEL_SYNC_ARTIFACT_DIR: artifacts/noor-khoy-fuel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check whether the scheduled daily report was already delivered
        id: delivery_status
        if: github.event_name == 'schedule'
        env:
          FUEL_STATUS_KIND: daily-report
          FUEL_STATUS_DATE_OFFSET_DAYS: '-1'
        run: node scripts/check-fuel-delivery-status.mjs
      - name: Record retry skipped after an earlier success
        if: github.event_name == 'schedule' && steps.delivery_status.outputs.needed == 'false'
        run: echo "Daily fuel report ${{ steps.delivery_status.outputs.report_date }} was already delivered at ${{ steps.delivery_status.outputs.delivered_at }}."
      - name: Install project dependencies
        if: github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false'
        run: npm ci
      - name: Install browser automation
        if: github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Download and upload fuel report
        id: fuel_import
        if: github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/noor-khoy-fuel
          node scripts/noor-khoy-fuel-sync.mjs 2>&1 | tee artifacts/noor-khoy-fuel/execution.log
      - name: Write execution summary
        if: always()
        shell: bash
        env:
          IMPORT_OUTCOME: ${{ steps.fuel_import.outcome }}
          DELIVERY_NEEDED: ${{ steps.delivery_status.outputs.needed }}
        run: |
          {
            echo "## Noor Khoy fuel sync"
            echo
            echo "- Delivery needed: ${DELIVERY_NEEDED:-manual}"
            echo "- Outcome: ${IMPORT_OUTCOME:-skipped-after-success}"
            echo "- Schedule slot: ${{ github.event.schedule || 'manual' }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep fuel workbook and diagnostics
        if: always() && (github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false')
        uses: actions/upload-artifact@v4
        with:
          name: noor-khoy-fuel-${{ github.run_id }}
          path: artifacts/noor-khoy-fuel/
          if-no-files-found: ignore
          retention-days: 7
      - name: Notify owner after the final morning attempt fails
        if: github.event_name == 'schedule' && github.event.schedule == '55 5 * * *' && steps.delivery_status.outputs.needed != 'false' && steps.fuel_import.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          text=$'<b>تعذر إرسال تقرير الوقود الصباحي</b>\nانتهت محاولات التشغيل التلقائي لليوم دون نجاح. راجع سجل GitHub Actions.'
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${text}" >/dev/null
      - name: Fail when fuel import failed
        if: (github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false') && steps.fuel_import.outcome != 'success'
        run: exit 1

  vehicle-balance-report:
    if: >-
      (github.event_name == 'schedule' && contains(fromJSON('["7 16 * * *","19 16 * * *","31 16 * * *","43 16 * * *","55 16 * * *","10 22 6 8 *","15 22 6 8 *","20 22 6 8 *"]'), github.event.schedule)) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_vehicle_balance)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_VEHICLES_URL: https://www.norkhoysa.com/companies/vehicles
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      FUEL_SYNC_MODE: vehicle-balance-report
      FUEL_SYNC_ARTIFACT_DIR: artifacts/noor-khoy-vehicle-balance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check whether the scheduled vehicle balance was already delivered
        id: delivery_status
        if: github.event_name == 'schedule'
        env:
          FUEL_STATUS_KIND: vehicle-balance-report
          FUEL_STATUS_DATE_OFFSET_DAYS: '0'
        run: node scripts/check-fuel-delivery-status.mjs
      - name: Record retry skipped after an earlier success
        if: github.event_name == 'schedule' && steps.delivery_status.outputs.needed == 'false'
        run: echo "Vehicle balance ${{ steps.delivery_status.outputs.report_date }} was already delivered at ${{ steps.delivery_status.outputs.delivered_at }}."
      - name: Install project dependencies
        if: github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false'
        run: npm ci
      - name: Install browser automation
        if: github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Sum vehicle diesel balances and send Telegram report
        id: vehicle_balance
        if: github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false'
        continue-on-error: true
        run: node scripts/noor-khoy-fuel-sync.mjs
      - name: Keep balance evidence
        if: always() && (github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false')
        uses: actions/upload-artifact@v4
        with:
          name: noor-khoy-vehicle-balance-${{ github.run_id }}
          path: artifacts/noor-khoy-vehicle-balance/
          if-no-files-found: ignore
          retention-days: 7
      - name: Notify owner after the final evening attempt fails
        if: github.event_name == 'schedule' && github.event.schedule == '55 16 * * *' && steps.delivery_status.outputs.needed != 'false' && steps.vehicle_balance.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          text=$'<b>تعذر إرسال رصيد الديزل المسائي</b>\nانتهت محاولات التشغيل التلقائي لليوم دون نجاح. راجع سجل GitHub Actions.'
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${text}" >/dev/null
      - name: Fail when vehicle balance failed
        if: (github.event_name != 'schedule' || steps.delivery_status.outputs.needed != 'false') && steps.vehicle_balance.outcome != 'success'
        run: exit 1
