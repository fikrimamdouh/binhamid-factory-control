name: Diagnose July failed ERP files

on:
  push:
    branches:
      - diagnose/july-failed-files-20260803
    paths:
      - '.github/workflows/diagnose-july-failed-files-20260803.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: diagnostic-connection.json
        run: node scripts/resolve-supabase-connection.mjs
      - name: Query July report state
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -t -A <<'SQL' > july-failed-files-diagnostic.json
          with dates(d) as (
            values ('2026-07-27'::date),('2026-07-28'::date),('2026-07-31'::date)
          ),
          batches as (
            select d.d as report_date,b.id,b.status,b.committed_at,b.original_name,b.summary
            from dates d
            left join lateral (
              select * from public.daily_report_batches x
              where x.report_date=d.d
              order by x.committed_at desc nulls last,x.created_at desc
              limit 1
            ) b on true
          ),
          stats as (
            select b.report_date,b.id,b.status,b.committed_at,b.original_name,b.summary,
              (select count(*) from public.daily_report_sales_lines s where s.batch_id=b.id) sales_rows,
              (select coalesce(sum(s.amount),0) from public.daily_report_sales_lines s where s.batch_id=b.id) sales_total,
              (select coalesce(sum(case when lower(coalesce(s.sale_type,''))='block' then s.amount else 0 end),0) from public.daily_report_sales_lines s where s.batch_id=b.id) block_total,
              (select coalesce(sum(case when lower(coalesce(s.sale_type,''))='concrete' then s.amount else 0 end),0) from public.daily_report_sales_lines s where s.batch_id=b.id) concrete_total,
              (select count(*) from public.daily_report_cash_movements c where c.batch_id=b.id) cash_rows,
              (select count(*) from public.daily_report_cash_movements c where c.batch_id=b.id and c.is_customer_collection=true) collection_rows,
              (select coalesce(sum(greatest(c.debit,c.credit)),0) from public.daily_report_cash_movements c where c.batch_id=b.id and c.is_customer_collection=true) collection_total
            from batches b
          ),
          target_invoices as (
            select coalesce(jsonb_agg(to_jsonb(q) order by q.invoice_no),'[]'::jsonb) rows
            from (
              select s.invoice_no,s.batch_id,b.report_date,s.customer_code,s.amount,s.quantity,s.item_name
              from public.daily_report_sales_lines s
              join public.daily_report_batches b on b.id=s.batch_id
              where s.invoice_no in ('12931','12932','12933','12934','12935','12936','12937','12938','18453','18454','18455','18456','18457','18458','18459')
              order by s.invoice_no,b.report_date
            ) q
          ),
          target_vouchers as (
            select coalesce(jsonb_agg(to_jsonb(q) order by q.movement_date,q.voucher_no,q.account_code),'[]'::jsonb) rows
            from (
              select c.batch_id,b.report_date,c.voucher_no,c.account_code,c.account_name,c.debit,c.credit,c.movement_date_text as movement_date,c.movement_type,c.is_customer_collection
              from public.daily_report_cash_movements c
              join public.daily_report_batches b on b.id=c.batch_id
              where c.voucher_no in ('258','259','260','261','263','264','265','266','267','268','269','270','271','272','485','487','488','489','490','491','492','494','497','499','500','501','502','503','565','566','567','568','569','570','571','572','573','574','575','576','577','578','579','580','581','582','583','584','585','586','587','588','589','590','591','592','593','594','603','604','997','998','999')
              order by c.movement_date_text,c.voucher_no,c.account_code
            ) q
          ),
          imports as (
            select coalesce(jsonb_agg(to_jsonb(q) order by q.updated_at desc),'[]'::jsonb) rows
            from (
              select id,status,original_name,posted_batch_id,last_error_code,last_error_message,summary,updated_at
              from public.imports
              where original_name ilike any(array['%2026-07-27%','%2026-07-28%','%2026-07-31%','%19-26%'])
              order by updated_at desc
              limit 100
            ) q
          )
          select jsonb_pretty(jsonb_build_object(
            'checkedAt',now(),
            'schemaVersion',(select coalesce(max(version),0) from public.migration_history),
            'dates',(select jsonb_agg(to_jsonb(stats) order by report_date) from stats),
            'targetInvoices',(select rows from target_invoices),
            'targetVouchers',(select rows from target_vouchers),
            'imports',(select rows from imports)
          ));
          SQL
          cat july-failed-files-diagnostic.json
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: july-failed-files-diagnostic-${{ github.run_id }}
          path: |
            july-failed-files-diagnostic.json
            diagnostic-connection.json
          retention-days: 3
