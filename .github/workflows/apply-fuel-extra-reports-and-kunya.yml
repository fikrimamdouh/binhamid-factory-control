name: Apply fuel extra reports and kunya

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fuel-extra-reports-and-kunya.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply report expansion
        run: python3 scripts/expand-fuel-reports-and-kunya.py
      - name: Validate changed files
        run: |
          node --check api/_lib/fuel-analytics.js
          node --check api/_lib/bot-fuel-reports.js
          node --check api/_lib/bot-profile.js
          node --test tests/fuel-extra-reports-and-kunya.test.mjs tests/fuel-latest-data-fallback.test.mjs tests/fuel-reports-section.test.mjs
      - name: Run project tests
        run: npm test
      - name: Commit changes and remove temporary tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/fuel-analytics.js api/_lib/bot-fuel-reports.js api/_lib/bot-profile.js tests/fuel-extra-reports-and-kunya.test.mjs
          git commit -m "Expand diesel reports and use Telegram kunyas"
          git push origin main
          git rm .github/workflows/apply-fuel-extra-reports-and-kunya.yml scripts/expand-fuel-reports-and-kunya.py
          git commit -m "Remove temporary fuel report expansion tools [skip ci]"
          git push origin main
