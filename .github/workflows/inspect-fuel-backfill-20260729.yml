name: Inspect fuel backfill 2026-07-29

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-fuel-backfill-20260729.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect backfill workflow and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          runs_file="$(mktemp)"
          curl -fsSL "${auth[@]}" "${api}/actions/workflows/backfill-fuel-20260729-once.yml/runs?per_page=5" > "$runs_file"
          echo '=== BACKFILL RUNS ==='
          jq -r '.workflow_runs[]? | [.id,.event,.status,(.conclusion//"-"),.created_at,.run_started_at,.updated_at,.head_sha,.html_url] | @tsv' "$runs_file"
          run_id="$(jq -r '.workflow_runs[0].id // empty' "$runs_file")"
          if [ -z "$run_id" ]; then echo 'NO_BACKFILL_RUN_FOUND'; exit 1; fi
          echo "=== RUN ${run_id} JOBS ==="
          jobs_file="$(mktemp)"
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100" > "$jobs_file"
          jq -r '.jobs[] | [.id,.name,.status,(.conclusion//"-"),.started_at,.completed_at] | @tsv' "$jobs_file"
          jq -r '.jobs[] as $job | $job.steps[]? | [$job.name,.number,.name,.status,(.conclusion//"-")] | @tsv' "$jobs_file"
          artifacts_file="$(mktemp)"
          curl -fsSL "${auth[@]}" "${api}/actions/runs/${run_id}/artifacts?per_page=100" > "$artifacts_file"
          echo '=== ARTIFACTS ==='
          jq -r '.artifacts[]? | [.id,.name,.expired,.created_at] | @tsv' "$artifacts_file"
          while IFS=$'\t' read -r artifact_id artifact_name expired; do
            [ -n "${artifact_id:-}" ] || continue
            [ "$expired" = "false" ] || continue
            dir="/tmp/backfill-${artifact_id}"
            mkdir -p "$dir/content"
            curl -fsSL -L "${auth[@]}" "${api}/actions/artifacts/${artifact_id}/zip" -o "$dir/artifact.zip"
            unzip -q "$dir/artifact.zip" -d "$dir/content"
            echo "=== ARTIFACT ${artifact_name} ==="
            find "$dir/content" -type f -printf '%P\n' | sort
            for file in "$dir/content/execution.log" "$dir/content/upload-response.json" "$dir/content/failure-context.json"; do
              [ -f "$file" ] || continue
              echo "=== FILE ${file#$dir/content/} ==="
              tail -n 300 "$file"
            done
          done < <(jq -r '.artifacts[]? | [.id,.name,(.expired|tostring)] | @tsv' "$artifacts_file")
