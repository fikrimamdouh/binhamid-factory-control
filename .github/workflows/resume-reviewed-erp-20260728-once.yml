name: Resume Reviewed ERP 2026-07-28 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-reviewed-erp-20260728-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-reviewed-erp-20260728
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resume reviewed report and deliver Telegram reports
        env:
          RESUME_TOKEN: ijIjySXn55hgX6Zy96IqzTmTUwaFDa5LVltjaDWAknI
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$RESUME_TOKEN"
          curl --silent --show-error --fail-with-body --max-time 600 \
            "https://binhamid-factory-control.vercel.app/api/erp/daily-report?action=resume-reviewed-2026-07-28&token=${RESUME_TOKEN}" \
            --output reviewed-erp-result.json
          cat reviewed-erp-result.json
          node <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('reviewed-erp-result.json','utf8'));
          if(!result.ok)throw new Error(`ERP resume returned ok=false: ${JSON.stringify(result)}`);
          const actual=result.validation?.actual||{};
          const expected={invoiceCount:18,salesTotal:53721,blockSales:5920,concreteSales:47801,collectionCount:12,collectionTotal:24627,cashMovementCount:24};
          for(const [key,value] of Object.entries(expected)){
            if(Number(actual[key])!==value)throw new Error(`Validation mismatch ${key}: ${actual[key]} != ${value}`);
          }
          if(!result.batch?.id)throw new Error('Approved batch id is missing');
          const delivery=result.delivery||{};
          const telegramErrors=delivery.telegram?.errors||[];
          const threeDayErrors=delivery.threeDay?.errors||[];
          if(telegramErrors.length||threeDayErrors.length){
            throw new Error(`Telegram delivery errors: ${JSON.stringify({telegramErrors,threeDayErrors})}`);
          }
          const evidence={
            ok:true,
            alreadyCompleted:Boolean(result.alreadyCompleted),
            reportDate:result.reportDate,
            batch:result.batch,
            posting:result.posting||null,
            validation:result.validation,
            storedBytes:result.storedBytes||null,
            delivery,
            verifiedAt:new Date().toISOString(),
            workflowRunId:process.env.GITHUB_RUN_ID,
            sourceCommit:process.env.GITHUB_SHA
          };
          fs.writeFileSync('reviewed-erp-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Publish execution evidence to repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='ops/reconciliation/reviewed-erp-20260728-result.json';
          const content=fs.readFileSync('reviewed-erp-evidence.json');
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`,{
            method:'PUT',
            headers:{
              Accept:'application/vnd.github+json',
              Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json'
            },
            body:JSON.stringify({
              message:'Record reviewed ERP 28 July execution evidence',
              content:content.toString('base64'),
              branch:'main'
            })
          });
          if(!response.ok)throw new Error(`Evidence publication failed: HTTP ${response.status} ${await response.text()}`);
          console.log('Evidence published:',path);
          NODE

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-erp-20260728-result-${{ github.run_id }}
          path: |
            reviewed-erp-result.json
            reviewed-erp-evidence.json
          if-no-files-found: warn
          retention-days: 14
