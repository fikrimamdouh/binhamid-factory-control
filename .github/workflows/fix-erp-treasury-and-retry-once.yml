name: Fix ERP treasury duplication and retry once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-erp-treasury-and-retry-once.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: fix-erp-treasury-and-retry-once
  cancel-in-progress: false

jobs:
  fix-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Patch the import lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          daily = Path('api/_lib/routes/daily-report.js')
          text = daily.read_text(encoding='utf-8')
          ready_marker = "transitionImport(importId,'ready_for_review',actor,'اكتمل التحقق الآلي والملف جاهز للترحيل')"
          if ready_marker not in text:
              old = "  let original;\n  try{original=await resolveStoredOriginal({importId,originalName,fileHash},reportDate,fileHash);}"
              new = "  await transitionImport(importId,'ready_for_review',actor,'اكتمل التحقق الآلي والملف جاهز للترحيل').catch(error=>{if(!/TRANSITION_INVALID/i.test(String(error?.message||'')))throw error;});\n  await transitionImport(importId,'processing',actor,'بدء الترحيل الآلي بعد التحقق').catch(error=>{if(!/TRANSITION_INVALID/i.test(String(error?.message||'')))throw error;});\n  let original;\n  try{original=await resolveStoredOriginal({importId,originalName,fileHash},reportDate,fileHash);}"
              if old not in text:
                  raise SystemExit('missing telegram import lifecycle patch marker')
              text = text.replace(old, new, 1)
              daily.write_text(text, encoding='utf-8')
          PY

      - name: Validate the production patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check api/_lib/daily-report-v3.js
          node --check api/_lib/daily-report-v8.js
          node --check api/_lib/erp-failed-cloud-retry.js
          node --check api/_lib/routes/daily-report.js
          test "$(grep -c "export function mergeTreasurySnapshots" api/_lib/daily-report-v3.js)" -eq 1
          grep -q "treasuries:mergeTreasurySnapshots" api/_lib/daily-report-v3.js
          grep -q "transitionImport(importId,'ready_for_review'" api/_lib/routes/daily-report.js
          grep -q "transitionImport(importId,'processing'" api/_lib/routes/daily-report.js

      - name: Commit the server fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'erp-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/_lib/routes/daily-report.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'تصحيح دورة حالة ملف ERP قبل الترحيل الآلي'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Retry the stored report after production deployment
        id: retry
        continue-on-error: true
        shell: bash
        env:
          RETRY_URL: https://binhamid-factory-control.vercel.app/api/erp/daily-report?action=retry-failed-cloud&reportDate=2026-08-05
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            token_response=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=binhamid-erp-failed-cloud-retry")
            token=$(node -e "const x=JSON.parse(process.argv[1]);if(!x.value)process.exit(2);process.stdout.write(x.value)" "$token_response")
            code=$(curl --max-time 120 -sS -o retry-response.json -w '%{http_code}' -H "Authorization: Bearer $token" "$RETRY_URL" || true)
            printf 'attempt=%s http=%s\n' "$attempt" "$code"
            cat retry-response.json || true
            printf '\n'
            if [ "$code" = '200' ] && grep -q '2026-08-06-treasury-dedup-v1' retry-response.json; then
              exit 0
            fi
            sleep 12
          done
          exit 1

      - name: Fail when the cloud retry failed
        if: always() && steps.retry.outcome != 'success'
        run: exit 1
