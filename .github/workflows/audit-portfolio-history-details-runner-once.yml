name: Run Portfolio History Details Audit Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-portfolio-history-details-runner-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: portfolio-history-details-connection.json
        run: node scripts/resolve-supabase-connection.mjs
      - name: Execute corrected detail query
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          awk '/cat > \/tmp\/details.sql <<.SQL./{capture=1;next} capture && /^          SQL$/{exit} capture{sub(/^          /,"");print}' .github/workflows/audit-portfolio-history-details-once.yml > /tmp/details.sql
          sed -i "s/m.customer_code,m.account_code/m.account_code/g; s/m.customer_name,m.account_name/m.account_name/g" /tmp/details.sql
          psql "$SUPABASE_DB_URL" -f /tmp/details.sql
          test -s audit-output/collection-visibility-summary.csv
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-history-details-${{ github.run_id }}
          path: audit-output/
          retention-days: 7
      - name: Publish status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          test -f audit-output/collection-visibility-summary.csv || state=failure
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='audit-portfolio-history-details' -f description='Portfolio history detail audit completed' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
