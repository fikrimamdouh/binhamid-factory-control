name: Export Portfolio Source Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-portfolio-source-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/api/_lib source/shared source/tests
          cp api/_lib/customer-portfolio-pdf.js source/api/_lib/
          cp api/_lib/customer-portfolio-document.js source/api/_lib/
          cp api/_lib/customer-settlement.js source/api/_lib/
          cp api/_lib/bot-customer-report-data.js source/api/_lib/
          cp shared/customer-portfolio-declaration.js source/shared/
          cp shared/customer-portfolio-ownership.js source/shared/
          cp tests/customer-portfolio-debt-allocation.test.mjs source/tests/
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-source-${{ github.run_id }}
          path: source/
          retention-days: 3
      - name: Publish export status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description='Portfolio source export completed'
          test -s source/api/_lib/customer-portfolio-pdf.js || { state=failure; description='Portfolio source export failed'; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='export-portfolio-source' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
