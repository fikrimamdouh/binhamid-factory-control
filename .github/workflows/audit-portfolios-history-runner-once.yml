name: Run Portfolio History Audit Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-portfolios-history-runner-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: portfolio-history-audit-connection.json
        run: node scripts/resolve-supabase-connection.mjs

      - name: Execute historical audit SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          awk '/cat > \/tmp\/audit-portfolio-history.sql <<.SQL./{capture=1;next} capture && /^          SQL$/{exit} capture{sub(/^          /,"");print}' .github/workflows/audit-portfolios-history-23-29-once.yml > /tmp/audit-portfolio-history.sql
          test -s /tmp/audit-portfolio-history.sql
          python - <<'PY'
          from pathlib import Path
          path=Path('/tmp/audit-portfolio-history.sql')
          text=path.read_text(encoding='utf-8')
          text=text.replace("\\copy (select jsonb_pretty(jsonb_build_object(","\\pset tuples_only on\n\\pset format unaligned\n\\o audit-output/portfolio-history-summary.json\nselect jsonb_pretty(jsonb_build_object(")
          text=text.replace("))) to 'audit-output/portfolio-history-summary.json'",")));\n\\o")
          path.write_text(text,encoding='utf-8')
          PY
          psql "$SUPABASE_DB_URL" -f /tmp/audit-portfolio-history.sql
          test -s audit-output/portfolio-history-summary.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-history-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 7

      - name: Publish audit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description='Portfolio history audit completed'
          test -f audit-output/portfolio-history-summary.json || { state=failure; description='Portfolio history audit failed'; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='audit-portfolios-history-full' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
