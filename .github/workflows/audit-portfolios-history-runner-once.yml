name: Run Portfolio History Audit Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-portfolios-history-runner-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: portfolio-history-audit-connection.json
        run: node scripts/resolve-supabase-connection.mjs

      - name: Execute historical audit SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          awk '/cat > \/tmp\/audit-portfolio-history.sql <<.SQL./{capture=1;next} capture && /^          SQL$/{exit} capture{sub(/^          /,"");print}' .github/workflows/audit-portfolios-history-23-29-once.yml > /tmp/audit-portfolio-history.sql
          test -s /tmp/audit-portfolio-history.sql
          python - <<'PY'
          from pathlib import Path
          path=Path('/tmp/audit-portfolio-history.sql')
          text=path.read_text(encoding='utf-8')
          marker="\\copy (select jsonb_pretty(jsonb_build_object("
          if marker in text:
              text=text.split(marker,1)[0]
          path.write_text(text,encoding='utf-8')
          PY
          psql "$SUPABASE_DB_URL" -f /tmp/audit-portfolio-history.sql
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('audit-output')
          def rows(name):
              path=root/name
              if not path.exists() or path.stat().st_size==0:return[]
              with path.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def num(value):
              try:return float(value or 0)
              except:return 0.0
          def yes(value):return str(value).strip().lower() in {'t','true','1','yes'}
          batches=rows('selected-batches.csv'); invoices=rows('all-invoices.csv'); collections=rows('all-collections.csv')
          checks=rows('source-ledger-checks.csv'); duplicates=rows('duplicates.csv'); name_issues=rows('name-issues.csv')
          portfolio=rows('daily-portfolio-rows.csv'); totals=rows('daily-totals.csv'); cross=rows('cross-sector-sales.csv')
          dates={r.get('report_date','') for r in batches}; all_dates={f'2026-07-{d:02d}' for d in range(23,30)}
          settled=[]; signature=[]
          for r in portfolio:
              item={'date':r.get('report_date'),'sector':r.get('sector_type'),'code':r.get('customer_code'),'name':r.get('display_name'),'previousBalance':num(r.get('previous_balance')),'sales':num(r.get('current_sales')),'grossDue':num(r.get('gross_due')),'collections':num(r.get('current_collections')),'finalDebt':num(r.get('final_debt')),'advance':num(r.get('final_advance'))}
              if yes(r.get('desired_signature_row')):signature.append(item)
              else:settled.append(item)
          summary={
            'period':{'from':'2026-07-23','to':'2026-07-29','selectedDays':len(batches),'missingDays':sorted(all_dates-dates)},
            'source':{'invoiceRows':len(invoices),'invoiceTotal':round(sum(num(r.get('amount')) for r in invoices),2),'collectionRows':len(collections),'collectionTotal':round(sum(num(r.get('amount')) for r in collections),2)},
            'checks':{'sourceLedgerErrors':sum(r.get('status')!='ok' for r in checks),'duplicates':len(duplicates),'nameDifferences':sum(r.get('status')=='name_difference' for r in name_issues),'blankNames':sum(r.get('status')=='blank_source_name' for r in name_issues),'portfolioFormulaErrors':sum(abs(num(r.get('formula_difference')))>0.02 for r in portfolio)},
            'byDay':totals,'crossSectorRows':len(cross),'settledRowsStillShownByCurrentLogic':settled,'signatureRows':signature,
            'sourceErrors':[r for r in checks if r.get('status')!='ok'],'duplicateDetails':duplicates,'nameIssues':name_issues
          }
          (root/'portfolio-history-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          test -s audit-output/portfolio-history-summary.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-history-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 7

      - name: Publish audit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description='Portfolio history audit completed'
          test -f audit-output/portfolio-history-summary.json || { state=failure; description='Portfolio history audit failed'; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='audit-portfolios-history-full' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
