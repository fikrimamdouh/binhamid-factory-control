name: Repair morning fuel sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-morning-fuel-sync.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: repair-morning-fuel-sync
  cancel-in-progress: false

jobs:
  diagnose-and-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOOR_KHOY_USERNAME: ${{ secrets.NOOR_KHOY_USERNAME }}
      NOOR_KHOY_PASSWORD: ${{ secrets.NOOR_KHOY_PASSWORD }}
      NOOR_KHOY_LOGIN_URL: https://www.norkhoysa.com/companies/login
      NOOR_KHOY_DASHBOARD_URL: https://www.norkhoysa.com/companies
      NOOR_KHOY_REPORT_URL: https://www.norkhoysa.com/companies/fuels?fueltype=all
      BINHAMID_FUEL_UPLOAD_URL: https://binhamid-factory-control.vercel.app/api/fuel/daily-report
      FUEL_REPORT_DATE_OFFSET_DAYS: '-1'
      FUEL_SEND_BALANCE: 'true'
      FUEL_NOTIFY: 'true'
      FUEL_SYNC_MODE: daily-report
      FUEL_SYNC_ARTIFACT_DIR: artifacts/noor-khoy-morning-repair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect diesel report command paths
        shell: bash
        run: |
          mkdir -p "$FUEL_SYNC_ARTIFACT_DIR"
          {
            echo '=== exact report strings ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'تقرير الديزل.*اليوم|اللترات:|القيمة:' api scripts public tests 2>/dev/null || true
            echo
            echo '=== workflow schedule ==='
            sed -n '1,150p' .github/workflows/noor-khoy-fuel-sync.yml
          } > "$FUEL_SYNC_ARTIFACT_DIR/code-diagnostics.txt"
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rerun yesterday fuel import
        id: rerun
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/noor-khoy-fuel-sync.mjs 2>&1 | tee "$FUEL_SYNC_ARTIFACT_DIR/execution.log"
      - name: Record diagnosis and clean temporary workflow
        if: always()
        shell: bash
        env:
          RERUN_OUTCOME: ${{ steps.rerun.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          root=pathlib.Path(os.environ['FUEL_SYNC_ARTIFACT_DIR'])
          def read(name):
              p=root/name
              return p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          response={}
          p=root/'upload-response.json'
          if p.exists():
              try: response=json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc: response={'parse_error':str(exc)}
          payload={
              'outcome':os.environ.get('RERUN_OUTCOME','unknown'),
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'commit':os.environ.get('GITHUB_SHA'),
              'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'upload_response':response,
              'execution_log_tail':'\n'.join(read('execution.log').splitlines()[-250:]),
              'code_diagnostics':read('code-diagnostics.txt')[:30000],
          }
          status=pathlib.Path('.github/fuel-sync-status/morning-repair.json')
          status.parent.mkdir(parents=True,exist_ok=True)
          status.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          rm -f .github/workflows/repair-morning-fuel-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/fuel-sync-status/morning-repair.json .github/workflows/repair-morning-fuel-sync.yml
          git commit -m "chore: record morning fuel sync diagnosis [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-fuel-repair-${{ github.run_id }}
          path: artifacts/noor-khoy-morning-repair/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if rerun failed
        if: steps.rerun.outcome != 'success'
        run: exit 1
