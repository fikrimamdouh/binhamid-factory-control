name: Audit Portfolio History Details Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-portfolio-history-details-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Resolve protected database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          CONNECTION_DIAGNOSTIC_PATH: portfolio-history-details-connection.json
        run: node scripts/resolve-supabase-connection.mjs
      - name: Query detailed evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          cat > /tmp/details.sql <<'SQL'
          \set ON_ERROR_STOP on
          set statement_timeout='180s';
          set client_min_messages=warning;

          create temp table latest_batches as
          select distinct on(report_date) id,report_date,original_name,status,committed_at,created_at
          from public.daily_report_batches
          where report_date between date '2026-07-23' and date '2026-07-29'
          order by report_date,committed_at desc nulls last,created_at desc,id desc;

          create temp table selected_approved as
          select distinct on(report_date) id,report_date,original_name,status,committed_at,created_at
          from public.daily_report_batches
          where status='approved' and report_date between date '2026-07-23' and date '2026-07-29'
          order by report_date,committed_at desc nulls last,created_at desc,id desc;

          create temp table period_sales as
          select b.report_date,b.id batch_id,l.source_row_no,
            concat('DR-',to_char(b.report_date,'YYYYMMDD'),'-S-',lpad(l.source_row_no::text,4,'0')) expected_reference,
            trim(coalesce(l.customer_code,'')) customer_code,trim(coalesce(l.customer_name,'')) customer_name,
            trim(coalesce(l.sales_type,'')) source_sales_type,trim(coalesce(l.item_name,'')) item_name,
            round(coalesce(l.amount,0)::numeric,2) amount
          from public.daily_report_sales_lines l join selected_approved b on b.id=l.batch_id;

          create temp table period_collections as
          select b.report_date,b.id batch_id,m.source_row_no,
            concat('DR-',to_char(b.report_date,'YYYYMMDD'),'-C-',lpad(m.source_row_no::text,4,'0')) expected_reference,
            trim(coalesce(m.customer_code,m.account_code,'')) customer_code,
            trim(coalesce(m.customer_name,m.account_name,'')) customer_name,
            round(greatest(coalesce(m.debit,0),coalesce(m.credit,0))::numeric,2) amount,
            trim(coalesce(m.voucher_no,'')) voucher_no
          from public.daily_report_cash_movements m join selected_approved b on b.id=m.batch_id
          where m.is_customer_collection=true and greatest(coalesce(m.debit,0),coalesce(m.credit,0))>0;

          create temp table legacy_clients as
          with state as (select coalesce((select payload from public.app_state where key='primary' limit 1),'{}'::jsonb) payload)
          select trim(coalesce(nullif(c->>'code',''),nullif(c->>'id',''),nullif(c->>'cr',''))) customer_code,
            trim(coalesce(c->>'name','')) legacy_name,
            trim(coalesce(c->>'rep',c->>'repId',c->>'salesRepId',c->>'employeeId','')) rep_id,
            trim(coalesce(c->>'primarySector',c->>'primary_sector',c->>'ownerSector',c->>'owner_sector','')) explicit_sector,
            trim(concat_ws(' ',c->>'seg',c->>'segment',c->>'costCenter',c->>'cost_center')) segment_text
          from state,lateral jsonb_array_elements(coalesce(payload->'legacy'->'cli','[]'::jsonb)) c
          where trim(coalesce(nullif(c->>'code',''),nullif(c->>'id',''),nullif(c->>'cr','')))<>'';

          create temp table employee_roles as
          with state as (select coalesce((select payload from public.app_state where key='primary' limit 1),'{}'::jsonb) payload),legacy as (
            select trim(coalesce(nullif(e->>'id',''),nullif(e->>'external_id',''))) employee_id,
              trim(coalesce(e->>'name',e->>'full_name','')) employee_name,
              trim(concat_ws(' ',e->>'declarationRole',e->>'role',e->>'job',e->>'position')) role_text
            from state,lateral jsonb_array_elements(coalesce(payload->'legacy'->'emp','[]'::jsonb)) e
          ),cloud as (
            select trim(coalesce(external_id,'')) employee_id,trim(coalesce(full_name,'')) employee_name,trim(coalesce(role,'')) role_text
            from public.employees where active=true
          )
          select distinct on(employee_id) employee_id,employee_name,role_text
          from (select * from legacy union all select * from cloud) x
          where employee_id<>'' order by employee_id,length(role_text) desc;

          create temp table first_sales as
          with sales as (
            select trim(coalesce(customer_external_id,'')) customer_code,sales_type,
              coalesce(delivery_date,created_at::date) sale_date,trim(coalesce(reference_no,'')) reference_no
            from public.sales_orders
            where status not in('cancelled','rejected') and trim(coalesce(customer_external_id,''))<>''
            union all
            select customer_code,source_sales_type,report_date,expected_reference from period_sales where customer_code<>''
          )
          select distinct on(customer_code) customer_code,sales_type first_sales_type,sale_date first_sale_date,reference_no first_sale_reference
          from sales where sales_type in('block','concrete')
          order by customer_code,sale_date,reference_no;

          create temp table ownership as
          with codes as (
            select customer_code from legacy_clients
            union select customer_code from period_sales where customer_code<>''
            union select customer_code from period_collections where customer_code<>''
          )
          select c.customer_code,l.legacy_name,l.rep_id,e.employee_name,e.role_text,l.explicit_sector,l.segment_text,
            f.first_sales_type,f.first_sale_date,f.first_sale_reference,
            case
              when lower(l.explicit_sector) like '%concrete%' or l.explicit_sector like '%خرسان%' then 'concrete'
              when lower(l.explicit_sector) like '%block%' or l.explicit_sector like '%بلوك%' or l.explicit_sector like '%بلك%' then 'block'
              when lower(e.role_text) like '%concrete%' or lower(e.role_text) like '%ready mix%' or e.role_text like '%خرسان%' then 'concrete'
              when lower(e.role_text) like '%block%' or e.role_text like '%بلوك%' or e.role_text like '%بلك%' then 'block'
              when lower(l.segment_text) like '%concrete%' or lower(l.segment_text) like '%ready mix%' or l.segment_text like '%خرسان%' then 'concrete'
              when lower(l.segment_text) like '%block%' or l.segment_text like '%بلوك%' or l.segment_text like '%بلك%' then 'block'
              when f.first_sales_type in('block','concrete') then f.first_sales_type else '' end owner_sector,
            case
              when trim(coalesce(l.explicit_sector,''))<>'' then 'explicit_sector'
              when trim(coalesce(e.role_text,''))<>'' then 'assigned_representative'
              when trim(coalesce(l.segment_text,''))<>'' then 'customer_segment'
              when f.first_sales_type in('block','concrete') then 'first_historical_sale' else 'unresolved' end owner_source
          from codes c left join legacy_clients l on l.customer_code=c.customer_code
          left join employee_roles e on e.employee_id=l.rep_id left join first_sales f on f.customer_code=c.customer_code;

          create temp table ledger_type_checks as
          select s.report_date,s.source_row_no,s.expected_reference,s.customer_code,s.customer_name,s.source_sales_type,s.item_name,s.amount,
            so.sales_type ledger_sales_type,so.payment_method,so.status ledger_status,
            case when so.id is null then 'missing' when coalesce(so.sales_type,'')=s.source_sales_type then 'exact' else 'different' end comparison
          from period_sales s left join lateral (
            select x.* from public.sales_orders x where x.reference_no=s.expected_reference order by x.created_at desc limit 1
          ) so on true;

          create temp table collection_visibility as
          select c.*,o.owner_sector,o.owner_source,o.legacy_name,o.segment_text,o.employee_name,o.role_text,o.first_sales_type,o.first_sale_date,
            coalesce((select round(sum(coalesce(ob.balance,0)),2) from public.customer_opening_balances ob where trim(coalesce(nullif(ob.customer_code,''),nullif(ob.client_id,'')))=c.customer_code and (case when coalesce(ob.balance_date,'')~'^\d{4}-\d{2}-\d{2}$' then ob.balance_date::date else date '1900-01-01' end)<c.report_date),0) opening_before,
            coalesce((select round(sum(coalesce(so.total_amount,0)),2) from public.sales_orders so where so.status not in('cancelled','rejected') and trim(coalesce(so.customer_external_id,''))=c.customer_code and so.sales_type=o.owner_sector and coalesce(so.delivery_date,so.created_at::date)<c.report_date),0) prior_sector_sales,
            coalesce((select round(sum(s.amount),2) from period_sales s where s.report_date=c.report_date and s.customer_code=c.customer_code and s.source_sales_type=o.owner_sector),0) current_sector_sales,
            case when o.owner_sector='' then 'unresolved_owner'
                 when coalesce((select sum(coalesce(so.total_amount,0)) from public.sales_orders so where so.status not in('cancelled','rejected') and trim(coalesce(so.customer_external_id,''))=c.customer_code and so.sales_type=o.owner_sector and coalesce(so.delivery_date,so.created_at::date)<c.report_date),0)
                    +coalesce((select sum(s.amount) from period_sales s where s.report_date=c.report_date and s.customer_code=c.customer_code and s.source_sales_type=o.owner_sector),0)<=0 then 'no_sector_sales_history'
                 else 'eligible_candidate' end visibility_reason
          from period_collections c left join ownership o on o.customer_code=c.customer_code;

          \copy (select id,report_date,original_name,status,committed_at,created_at from public.daily_report_batches where report_date between date '2026-07-23' and date '2026-07-29' order by report_date,created_at,id) to 'audit-output/all-batches-23-29.csv' csv header
          \copy (select * from latest_batches order by report_date) to 'audit-output/latest-batch-per-date.csv' csv header
          \copy (select * from selected_approved order by report_date) to 'audit-output/selected-approved-batches.csv' csv header
          \copy (select * from ledger_type_checks where comparison<>'exact' order by report_date,source_row_no) to 'audit-output/ledger-type-differences.csv' csv header
          \copy (select * from ownership order by customer_code) to 'audit-output/customer-ownership-evidence.csv' csv header
          \copy (select * from collection_visibility where visibility_reason<>'eligible_candidate' order by report_date,amount desc,customer_code) to 'audit-output/hidden-collection-reasons.csv' csv header
          \copy (select report_date,owner_sector,visibility_reason,count(*) movement_count,round(sum(amount),2) amount from collection_visibility group by report_date,owner_sector,visibility_reason order by report_date,owner_sector,visibility_reason) to 'audit-output/collection-visibility-summary.csv' csv header
          SQL
          psql "$SUPABASE_DB_URL" -f /tmp/details.sql
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-history-details-${{ github.run_id }}
          path: audit-output/
          retention-days: 7
      - name: Publish status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          test -f audit-output/collection-visibility-summary.csv || state=failure
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='audit-portfolio-history-details' -f description='Portfolio history detail audit completed' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
